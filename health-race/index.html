<title>HEALTH RACE</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:only light;--navy:#102A43;--lime:#B7E432;--lb:#EAF3F8;--gr:#F4F6F8;--ln:#d5dde5;--mut:#52637a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff!important;color:var(--navy);font-family:Sarabun,"Noto Sans Thai",Tahoma,sans-serif;font-size:17px;overflow-x:clip}
body.playing{overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
button{touch-action:manipulation;font-family:inherit}
.w{max-width:780px;margin:0 auto;padding:10px 14px 36px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top b{font-size:19px}
.sm{min-height:44px;min-width:48px;border:2px solid var(--ln);background:var(--gr);color:var(--navy);border-radius:22px;padding:6px 14px;font:600 15px Sarabun,sans-serif;cursor:pointer}
.mas{display:flex;gap:10px;align-items:center;margin:8px 0}.mas svg{width:88px;flex:none}
.fx .mas svg{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.bub{background:var(--lb);border-radius:16px;padding:10px 14px;line-height:1.45;position:relative;flex:1}
.bub:before{content:"";position:absolute;left:-8px;top:20px;border:8px solid transparent;border-right-color:var(--lb);border-left:0}
h1{font-size:32px;line-height:1.15;margin:6px 0}h2{font-size:22px;margin:8px 0}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:16px;font:800 19px Sarabun,sans-serif;color:var(--navy);background:var(--lime);box-shadow:0 5px 0 #8fb116;cursor:pointer;margin:10px 0 6px;text-align:center;text-decoration:none;line-height:56px;padding:0}
.btn.s{background:var(--gr);box-shadow:0 3px 0 var(--ln)}.btn:disabled{opacity:.45;box-shadow:none}
.btn:focus-visible,.sm:focus-visible,.hb:focus-visible,.cb:focus-visible,.car:focus-visible{outline:3px solid #2F8FE0;outline-offset:2px}
.card{background:var(--gr);border-radius:18px;padding:14px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--ln)}
.score{font-size:56px;font-weight:800;background:var(--lime);border-radius:20px;padding:2px 20px;display:inline-block;line-height:1.2}
.note{font-size:13px;color:var(--mut);line-height:1.5}ul{padding-left:20px;margin:6px 0}li{margin:4px 0}
.how{background:var(--lb);border-radius:16px;padding:10px 14px;margin:10px 0}.how ul{padding:0}.how li{list-style:none;margin:6px 0}
.pill{display:inline-block;background:var(--navy);color:var(--lime);border-radius:20px;padding:4px 14px;font-weight:800;font-size:15px}
.k1{background:linear-gradient(135deg,#f3fbd0,#fff);border:2px solid var(--lime)}.k2{background:linear-gradient(135deg,#e6f1fb,#fff);border:2px solid #9cc7ec}
.cars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.car{background:var(--lb);border:4px solid var(--ln);border-radius:18px;padding:6px 4px 8px;cursor:pointer;color:var(--navy);font:700 14px Sarabun,sans-serif;text-align:center;min-height:120px}
.car canvas{width:100%;height:auto;display:block}
.car[aria-pressed=true]{border-color:var(--lime);background:#f6fbe0;box-shadow:0 0 0 3px var(--navy)}
.star{position:fixed;top:-20px;font-size:22px;color:#e9a700;animation:fall 2.2s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
.nofx *{animation:none!important;transition:none!important}
.ov{position:fixed;inset:0;background:rgba(16,42,67,.92);display:none;z-index:99;color:#fff;overflow:auto;padding:16px}
.ov>div{max-width:560px;margin:0 auto;text-align:center}.ov img{max-width:100%;max-height:60vh;border-radius:10px}
#md>div{background:#fff;color:var(--navy);border-radius:20px;padding:18px;text-align:left}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px;display:none;z-index:120;max-width:90%;text-align:center}
.ok{color:#17803a}.bad{color:#b3261e}
#play{position:fixed;inset:0;display:none;flex-direction:column;background:var(--navy);z-index:50;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#hud{flex:none;background:#0b1f33;color:#fff;padding:6px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;min-height:50px}
#hud .st{display:flex;flex-direction:column;line-height:1.1;min-width:54px}#hud small{opacity:.8;font-size:11px}#hud b{font-size:21px;color:var(--lime)}
#hud .tm{flex:1 1 100%;order:9;min-width:60px}.tb{height:10px;background:rgba(255,255,255,.2);border-radius:8px;overflow:hidden}.tb i{display:block;height:100%;width:100%;background:var(--lime);transform-origin:left}.tb.low i{background:#ffb6c8}
#hud .sp{flex:1}
#hud .hb{min-width:46px;min-height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.16);color:#fff;font:800 18px Sarabun,sans-serif;cursor:pointer}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background:#7cc6ee}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#msg{position:absolute;left:0;right:0;top:8px;text-align:center;pointer-events:none;z-index:2}
#msg span{display:inline-block;background:rgba(255,255,255,.92);color:var(--navy);border-radius:14px;padding:5px 14px;font-weight:800;font-size:15px;max-width:92%}
#ctl{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));align-items:stretch;z-index:2}
.cb{min-width:84px;min-height:72px;border-radius:18px;border:3px solid #fff;background:rgba(16,42,67,.72);color:#fff;font:800 32px Sarabun,sans-serif;cursor:pointer;box-shadow:0 5px 0 rgba(9,26,43,.8);padding:0;touch-action:manipulation}
.cb:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(9,26,43,.8)}.cb:disabled{opacity:.45}
#bb{flex:1;min-height:72px;border-radius:18px;border:4px solid #fff;background:radial-gradient(circle at 30% 25%,#d7f56e,#9fcb1c);color:var(--navy);font:800 22px Sarabun,sans-serif;box-shadow:0 6px 0 #6f8f10;cursor:pointer;padding:0;position:relative;overflow:hidden}
#bb:disabled{opacity:.6;box-shadow:none}#bb:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 #6f8f10}
#bbf{position:absolute;left:0;bottom:0;height:7px;background:var(--navy);width:0}
#pov{position:absolute;inset:0;background:rgba(16,42,67,.85);display:none;align-items:center;justify-content:center;z-index:4;padding:16px}
#pov>div{background:#fff;border-radius:22px;padding:18px;max-width:340px;width:100%;text-align:center}
#tu{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:3;font-size:44px;font-weight:800;color:#fff;text-shadow:0 3px 0 var(--navy),0 0 12px var(--navy);text-align:center;pointer-events:none}
@media(max-height:500px){h1{font-size:26px}.cb{min-width:76px;min-height:56px}#bb{min-height:56px;font-size:19px}#hud{min-height:44px;padding:3px 10px}#hud b{font-size:18px}#hud .tm{flex:1 1 140px;order:0}#ctl{padding:4px 12px 6px}}
@media(min-width:700px){#hud .tm{flex:1 1 0;order:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
