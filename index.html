<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booth Mall Insurance 2569</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: เมนูซ้าย (นำทาง) + พื้นที่เนื้อหา (หัวหน้า → ตัวกรอง → เนื้อหาเฉพาะหน้า) */
:root{
  --side:#0f2350; --side-2:#16306a; --side-text:#b9c6e3;
  --bg:#f5f7fb; --surface:#ffffff; --border:#e4e9f2; --border-strong:#cfd8e6;
  --text:#101a2e; --text-2:#4d5970; --muted:#8590a6;
  --accent:#2a6fdb; --accent-soft:#eaf1fd;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#0f8a4b; --good-bg:#e6f5ec; --warn:#b26a00; --warn-bg:#fff3dc; --bad:#c62f2f; --bad-bg:#fdeaea; --info-bg:#eaf1fd;
  --radius:14px; --shadow:0 1px 2px rgba(16,26,46,.05),0 4px 14px rgba(16,26,46,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100vh}

/* Sidebar */
.side{width:248px;flex:none;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px 14px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px;color:#fff}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15.5px;line-height:1.2}
.brand small{font-size:12px;color:var(--side-text)}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.nav .grp{font-size:11.5px;letter-spacing:.06em;color:#7f8fb3;padding:14px 12px 6px;font-weight:600}
.nav button,.side-foot button{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 12px;border-radius:9px;font-size:14px;display:flex;gap:11px;align-items:center;color:var(--side-text)}
.nav button svg,.side-foot button svg{width:18px;height:18px;flex:none;opacity:.85}
.nav button:hover,.side-foot button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="true"]{background:var(--side-2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #6ea3ff}
.side-foot{border-top:1px solid rgba(255,255,255,.1);padding-top:10px;margin-top:8px}
.scrim{display:none}

.main{flex:1;min-width:0;padding:22px 28px 28px;display:flex;flex-direction:column;gap:16px}

/* Header */
.topbar{display:none}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.crumb{font-size:12.5px;color:var(--muted);font-weight:500}
.head h1{margin:2px 0 0;font-size:25px;line-height:1.25;color:var(--text);text-wrap:balance}
.head .sub{color:var(--text-2);font-size:13.5px}
.src{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.src-meta{font-size:12px;color:var(--muted);text-align:right;line-height:1.5}
.src-meta b{color:var(--text)}
.src-meta a{color:var(--accent)}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--good)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.sm{padding:5px 10px;font-size:12.5px}
.banner{border-radius:10px;padding:10px 14px;font-size:13.5px}
.banner>b:first-child{margin-right:8px}
.banner.warn{background:var(--warn-bg);color:#6b3f00;border:1px solid #f1d39c}
.banner.bad{background:var(--bad-bg);color:#7d1717;border:1px solid #f2b8b8}
.banner.info{background:var(--info-bg);color:#173c74;border:1px solid #cddcf5}
.banner a{color:inherit;font-weight:600}

/* Filters: แถวเดียว กะทัดรัด */
.filters{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;box-shadow:var(--shadow)}
.f{flex:1 1 140px;min-width:0}
.f.tgt{flex:0 1 150px}
.f label{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--text-2);margin-bottom:3px;font-weight:500}
.f select,.f input{width:100%;border:1px solid var(--border-strong);border-radius:9px;padding:7px 9px;background:var(--surface);min-width:0}
.f select.on{border-color:var(--accent);background:var(--accent-soft);color:#173c74;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--text-2)}
.chips:empty{display:none}
.chip{background:var(--accent-soft);color:#173c74;border:1px solid #cddcf5;border-radius:99px;padding:2px 4px 2px 10px;display:inline-flex;gap:4px;align-items:center}
.chip button{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.chip button:hover{background:#cddcf5}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpis[hidden]{display:none!important}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.kpi:hover{border-color:var(--border-strong)}
.kpi .t{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--text-2);font-size:13.5px}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--c-bg);color:var(--c)}
.kpi .ic svg{width:18px;height:18px}
.kpi .t .tip{margin-left:auto}
.kpi .v{font-size:31px;font-weight:700;color:var(--text);line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi .v small{font-size:14px;font-weight:600;color:var(--text-2);margin-left:5px;letter-spacing:0}
.kpi .v.hl{color:var(--c)}
.kpi .rows{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12.5px;color:var(--text-2);margin-top:auto;border-top:1px solid var(--border);padding-top:9px}
.kpi .rows b{color:var(--text);font-variant-numeric:tabular-nums;text-align:right}
.bar{height:8px;background:#edf1f7;border-radius:99px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.bar>.pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.55}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;width:fit-content}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.neutral{background:#eef1f6;color:var(--text-2)}
.delta.up{color:var(--good);font-weight:600} .delta.down{color:var(--bad);font-weight:600}
.na{color:var(--muted);font-size:12.5px}
.tip{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--border-strong);font-size:11px;color:var(--muted);cursor:help;position:relative;flex:none;font-weight:500}
.tip::after{content:attr(data-tip);position:absolute;right:-6px;top:22px;z-index:20;width:260px;background:var(--text);color:#fff;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:400;line-height:1.45;white-space:pre-line;text-align:left;opacity:0;visibility:hidden;transition:opacity .18s ease,visibility .18s}
.tip:hover::after,.tip:focus::after{opacity:1;visibility:visible}

/* Cards & grid */
#view{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0;font-size:15.5px;color:var(--text)}
.card .cap{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.card-h .more{font-size:13px;color:var(--accent);cursor:pointer;background:none;border:0;font-weight:500}
.chart{position:relative;height:300px}
.chart.tall{height:380px}
.chart.sm{height:250px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .l{font-size:12.5px;color:var(--text-2);display:flex;gap:4px;align-items:center}
.stat .n{font-size:22px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.stat .n small{font-size:12.5px;color:var(--text-2);font-weight:500;margin-left:4px}
.stat .n{overflow-wrap:anywhere}
.stat.sm .n{font-size:18px;line-height:1.5}
.stat.key{background:var(--accent);border-color:var(--accent)}
.stat.key .l,.stat.key .n,.stat.key .n small{color:#fff}
.src-tag{font-size:11.5px;color:var(--muted)}
.missing{border:1px dashed #e0b86a;background:#fffaf0;border-radius:12px;padding:14px 16px;color:#5d3d00}
.missing b{color:#3d2800}
.missing ul{margin:6px 0 0 18px;padding:0}

/* Tables */
.tbl-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tbl-tools input{border:1px solid var(--border-strong);border-radius:9px;padding:6px 10px;min-width:0;flex:1;max-width:320px}
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:560px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 12px;border-bottom:1px solid #eef1f6;text-align:left;white-space:nowrap}
th{background:#f7f9fc;color:var(--text-2);font-weight:600;position:sticky;top:0;z-index:1;cursor:pointer;user-select:none;font-size:12.5px}
th:hover{color:var(--accent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:#f5f8ff}
tr.total td{font-weight:700;background:#f7f9fc;border-top:2px solid var(--border-strong)}
tr.skip td{color:var(--muted);background:#fbfbfc}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:12.5px;color:var(--text-2)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:99px;padding:1px 8px;font-weight:600}
.badge.good{background:var(--good-bg);color:var(--good)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.neutral{background:#eef1f6;color:var(--text-2)}
details.raw summary{cursor:pointer;color:var(--accent);font-weight:500;padding:2px 0;font-size:13.5px}
details.raw[open] summary{margin-bottom:10px}
.rank{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:#eef1f6;font-size:12px;font-weight:700;color:var(--text-2)}
.rank.top{background:var(--accent);color:#fff}

/* Motion — ละเอียด สั้น 150–300ms และปิดเมื่อผู้ใช้ตั้ง reduce motion */
.f select,.f input{transition:border-color .15s ease,background-color .15s ease}
/* Entrance: fade + slide-up แบบไล่ลำดับ (header → ตัวกรอง → การ์ด → กราฟ) เล่นเมื่อเปิดหน้า/เปลี่ยนเมนูเท่านั้น */
.rise{animation:rise .42s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* เปลี่ยนตัวกรอง: เนื้อหาเฟดเข้าเบาๆ (ไม่เลื่อนตำแหน่ง) */
.refresh{animation:refresh .25s ease-out}
@keyframes refresh{from{opacity:.35}to{opacity:1}}
/* Scroll reveal: เฉพาะการ์ดที่ยังอยู่นอกจอตอนโหลด */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.flash{animation:flash .6s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px rgba(42,111,219,.35)}to{box-shadow:var(--shadow)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,12px);background:var(--text);color:#fff;padding:9px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.rise,.refresh,.sk{animation:none}.reveal{opacity:1;transform:none;transition:none}.side,.toast,.tip::after{transition:none}}

.cum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:14px}
.cum .l{font-size:12.5px;color:var(--text-2)}
.cum .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);line-height:1.2}
.cum .big small{font-size:13px;font-weight:500;color:var(--text-2);margin-left:5px}
.cum .big.muted{color:var(--text-2)} .cum .big.ok{color:var(--good)} .cum .big.low{color:var(--s2)}
.bullet{position:relative;height:14px;background:#edf1f7;border-radius:99px;margin:6px 0 22px}
.bullet .act{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bullet .act.ok{background:var(--good)}
.bullet .tgt{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--text)}
.bullet .tgt em{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11.5px;color:var(--text-2);white-space:nowrap}
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.qcard{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);transition:background-color .2s ease,border-color .2s ease,box-shadow .2s ease;min-width:0}
.qcard:hover{border-color:var(--border-strong);background:#fafbfd}
.qcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qcard.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 3px 0 var(--accent)}
.qcard[disabled]{cursor:default;opacity:.75}
.qcard .qh{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.qcard .qv{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.qcard .qv small{font-size:12px;color:var(--text-2);font-weight:500;margin-left:4px}
.qcard .qv.none{font-size:15px;color:var(--muted);font-weight:600}
.qcard .qr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12.5px;color:var(--text-2)}
.qcard .qr b{color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:900px){.qgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.cum{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.bullet .act,.qcard{transition:none}}

.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{border:1px solid var(--border-strong);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:13.5px;color:var(--text-2);transition:background-color .2s ease,border-color .2s ease,color .2s ease}
.seg:hover{border-color:var(--accent);color:var(--accent)}
.seg.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg[disabled]{cursor:not-allowed;opacity:.5}
.seg[disabled]:hover{border-color:var(--border-strong);color:var(--text-2)}
.ctl{display:flex;gap:8px}
.ctl select{border:1px solid var(--border-strong);border-radius:9px;padding:6px 9px;background:var(--surface)}
tr.top3 td{background:#f7faff}
@media (prefers-reduced-motion:reduce){.seg{transition:none}}

.seg-wrap{display:flex;flex-direction:column;gap:10px}
.seg-group{display:flex;flex-direction:column;gap:6px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;padding-top:6px}
.pod{border:1px solid var(--border);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;background:var(--surface)}
.pod .pr{font-size:12.5px;font-weight:600;color:var(--text-2)}
.pod .pm{font-size:16px;font-weight:700;color:var(--text)}
.pod .pv{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);overflow-wrap:anywhere}
.pod.pos1{order:2;padding-top:26px;padding-bottom:26px}
.pod.pos2{order:1} .pod.pos3{order:3}
.pod.p1{background:#fbf6e6;border-color:#e7d391;box-shadow:inset 0 4px 0 #c9a227}
.pod.p1 .pv{font-size:26px}
.pod.p2{background:#f4f6f9;border-color:#d3d9e1;box-shadow:inset 0 4px 0 #9aa3af}
.pod.p3{background:#f9f0e9;border-color:#e3c4ad;box-shadow:inset 0 4px 0 #b7774a}
.medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff}
.medal svg{width:24px;height:24px}
.medal.m1{background:#c9a227;width:52px;height:52px} .medal.m2{background:#9aa3af} .medal.m3{background:#b7774a}
.rank.r1{background:#c9a227;color:#fff} .rank.r2{background:#9aa3af;color:#fff} .rank.r3{background:#b7774a;color:#fff}
@media (max-width:700px){.podium{grid-template-columns:minmax(0,1fr)}.pod.pos1,.pod.pos2,.pod.pos3{order:0}}

.compact table{font-size:12px;table-layout:auto}
.compact th,.compact td{padding:6px 7px}
.compact th{white-space:normal;line-height:1.3;vertical-align:bottom;min-width:0}
.compact td{white-space:nowrap}
.compact .tbl-wrap{overflow-x:auto}
.compact .rank{width:20px;height:20px;font-size:11px}

.kpi6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi6 .stat{display:flex;flex-direction:column;justify-content:space-between;min-height:84px}
.kpi6 .stat .n{font-size:19px;overflow-wrap:normal;white-space:nowrap;line-height:1.3}
.kpi6 .stat .n small{display:block;margin-left:0;font-size:12px}
.bf{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.bf-l{flex:1 1 420px;min-width:0}
.bf-r{display:flex;gap:8px;align-items:flex-end;flex:0 1 380px;min-width:0;flex-wrap:wrap}
.bf-r select{flex:1;min-width:0;border:1px solid var(--border-strong);border-radius:9px;padding:7px 9px;background:var(--surface)}
.bf .lbl{font-size:12px;color:var(--text-2);font-weight:500;margin-bottom:6px;display:block;width:100%}
.wrapname{white-space:normal;display:inline-block;max-width:220px;line-height:1.35}
@media (max-width:1280px){.kpi6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpi6{grid-template-columns:repeat(2,minmax(0,1fr))}}

.bm{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.bm .lbl,.msum .lbl{font-size:12px;color:var(--text-2);font-weight:500;margin-bottom:6px;display:block}

<script>
/* =====================================================================
 * 0) CONFIG — ตั้งค่าที่มีผลกับทุกคนที่เปิด (เว้นว่าง = ให้ระบบเลือกเอง)
 *    primaryTab : ชื่อแท็บที่ใช้คำนวณ KPI เช่น 'Branch Detail'
 *    fypHeader  : ชื่อคอลัมน์ FYP ที่ต้องใช้ เช่น 'FYP Credit'
 * ===================================================================== */
const CONFIG = { primaryTab: '', fypHeader: '' };
/* ลิงก์ Web App (/exec) สำหรับกรณีวางไฟล์นี้บนเว็บอื่น เช่น GitHub Pages (ไม่มีแถบเตือนของ Apps Script)
 * ถ้าเปิดผ่าน Apps Script โดยตรง ไม่ต้องใส่ — ระบบใช้ google.script.run ตามเดิม */
const API_URL = 'https://script.google.com/macros/s/AKfycbwuBmJ5kVPbULQkq2IXRNc2pDYDlmnn2PTvcCIjYY38vEEEYxqvK3mC5N70WY3S2vW7/exec';

/* =====================================================================
 * 1) DATA SOURCE LAYER — เปลี่ยนวิธีเชื่อมต่อได้ที่นี่ที่เดียว
 * ===================================================================== */
const DataSource = {
  _call(fn) {
    return new Promise((resolve, reject) => {
      if (!(window.google && google.script && google.script.run)) {
        // โหมดเว็บภายนอก: ดึงข้อมูล JSON จาก Web App (?api=getDashboardData / getVersion)
        if (!API_URL) { reject(new Error('ยังไม่ได้ใส่ลิงก์ Web App ใน API_URL (ไฟล์ index.html)')); return; }
        fetch(API_URL + (API_URL.includes('?') ? '&' : '?') + 'api=' + fn + '&t=' + Date.now(), { cache: 'no-store' })
          .then(r => { if (!r.ok) throw new Error('เชื่อมต่อ Web App ไม่สำเร็จ (HTTP ' + r.status + ')'); return r.text(); })
          .then(t => { try { resolve(JSON.parse(t)); } catch (e) { reject(new Error('Web App ไม่ได้ส่งข้อมูล JSON กลับมา — ตรวจสอบว่า Deploy เวอร์ชันใหม่ของ Code.gs และตั้ง Who has access เป็น Anyone')); } })
          .catch(e => reject(e instanceof Error ? e : new Error(String(e))));
        return;
      }
      google.script.run
        .withSuccessHandler(s => { try { resolve(JSON.parse(s)); } catch (e) { reject(e); } })
        .withFailureHandler(e => reject(e instanceof Error ? e : new Error(String(e && e.message || e))))[fn]();
    });
  },
  async load() {
    const res = await this._call('getDashboardData');
    if (!res.ok) throw new Error(res.error || 'อ่านชีตไม่สำเร็จ');
    return res;
  },
  async version() {
    const res = await this._call('getVersion');
    return res.ok ? res.version : null;
  }
};

/* =====================================================================
 * 2) PARSING UTILITIES
 * ===================================================================== */
const U = {
  norm: s => String(s == null ? '' : s).replace(/[​ ]/g, ' ').replace(/\s+/g, ' ').trim(),
  key: s => U.norm(s).toLowerCase(),
  isEmpty: v => v === '' || v == null || (typeof v === 'string' && v.trim() === ''),
  /** ช่องว่างหรือขีด (-, —) = ไม่มีค่า (ไม่ใช่ข้อความ) ใช้ตอนตรวจว่าคอลัมน์เป็นตัวเลขหรือไม่ */
  blankish: v => U.isEmpty(v) || (typeof v === 'string' && /^\s*[-–—]+\s*$/.test(v)),
  /** ตัวเลข: คืน null เมื่อไม่มีค่า (แยกจากศูนย์) */
  num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : null;
    if (typeof v === 'boolean' || v == null || typeof v === 'object') return null;
    let s = String(v).trim();
    if (!s || /^[-–—]+$/.test(s) || /^(n\/?a|#n\/a|#ref!|#value!|#div\/0!)$/i.test(s)) return null;
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    const pct = /%$/.test(s);
    const mil = /ล้าน/.test(s);
    s = s.replace(/[,\s฿]|บาท|THB|ล้าน/gi, '').replace(/%$/, '');
    if (!/^[-+]?\d*\.?\d+(e[-+]?\d+)?$/i.test(s)) return null;
    let n = parseFloat(s);
    if (neg) n = -n;
    if (pct) n = n / 100;
    if (mil) n = n * 1e6;
    return isFinite(n) ? n : null;
  },
  TH_MONTHS: [
    ['ม.ค.', 'มกราคม', 'jan'], ['ก.พ.', 'กุมภาพันธ์', 'feb'], ['มี.ค.', 'มีนาคม', 'mar'], ['เม.ย.', 'เมษายน', 'apr'],
    ['พ.ค.', 'พฤษภาคม', 'may'], ['มิ.ย.', 'มิถุนายน', 'jun'], ['ก.ค.', 'กรกฎาคม', 'jul'], ['ส.ค.', 'สิงหาคม', 'aug'],
    ['ก.ย.', 'กันยายน', 'sep'], ['ต.ค.', 'ตุลาคม', 'oct'], ['พ.ย.', 'พฤศจิกายน', 'nov'], ['ธ.ค.', 'ธันวาคม', 'dec']
  ],
  /** หาเดือน (1-12) จากข้อความ */
  EN_FULL: ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'],
  /** หาเดือน (1-12) จากข้อความ — จับคู่แบบทั้งคำเท่านั้น (กันชื่ออย่าง "Marina" ถูกอ่านเป็นมีนาคม) */
  monthOf(v) {
    if (typeof v === 'number') return (v >= 1 && v <= 12 && Number.isInteger(v)) ? v : null;
    const s = U.norm(v); if (!s) return null;
    if (/^\d{1,2}$/.test(s)) { const n = +s; return n >= 1 && n <= 12 ? n : null; }
    const toks = s.toLowerCase().split(/[\s\-\/,]+/).map(t => t.replace(/\d+$/, '')).filter(Boolean);
    for (const tk of toks) {
      const bare = tk.replace(/\./g, '');
      for (let i = 0; i < 12; i++) {
        const [ab, full, en] = U.TH_MONTHS[i];
        if (tk === ab || bare === ab.replace(/\./g, '') || tk === full || bare === en || bare === U.EN_FULL[i]) return i + 1;
      }
    }
    return null;
  },
  toAD(y) { if (y == null) return null; if (y < 100) return y >= 60 ? y + 2500 - 543 : 2000 + y; return y > 2400 ? y - 543 : y; },
  /** วันที่: รองรับ {d:ISO}, ISO, d/m/y (พ.ศ./ค.ศ.), "15 มี.ค. 26" */
  date(v) {
    if (v && typeof v === 'object' && v.d) { const m = String(v.d).match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return null; return new Date(U.toAD(+m[1]), +m[2] - 1, +m[3]); }
    if (typeof v === 'number' || U.isEmpty(v)) return null;
    const s = U.norm(v);
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(U.toAD(+m[1]), +m[2] - 1, +m[3]);
    m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
    if (m) return new Date(U.toAD(+m[3]), +m[2] - 1, +m[1]);
    m = s.match(/^(\d{1,2})\s*([^\d\s]+\.?[^\d\s]*)\s*(\d{2,4})?$/);
    if (m) { const mo = U.monthOf(m[2]); if (mo) { const y = m[3] ? U.toAD(+m[3]) : null; return y ? new Date(y, mo - 1, +m[1]) : null; } }
    return null;
  },
  /** ปี ค.ศ. ที่ยอมรับได้ (กันวันที่ผิดรูปแบบ เช่น เลขทั่วไปในช่องวันที่ → ปี 1956 = พ.ศ. 2499) */
  validYear: y => y != null && y >= 2015 && y <= 2040,
  validDate: d => d && !isNaN(d) && U.validYear(d.getFullYear()) ? d : null,
  colLetter(i) { let s = ''; i++; while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; },
  esc: s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
};

/* Number formatting (ภายในเป็นบาทเสมอ แปลงเป็นล้านตอนแสดงผล) */
const F = {
  mb: (b, d = 2) => b == null ? '—' : (b / 1e6).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d }),
  mbU: (b, d = 2) => b == null ? '—' : F.mb(b, d) + ' ล้านบาท',
  baht: b => b == null ? '—' : Math.round(b).toLocaleString('th-TH'),
  bahtU: b => b == null ? '—' : F.baht(b) + ' บาท',
  n: (v, d = 0) => v == null ? '—' : Number(v).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d }),
  pct: (v, d = 2) => v == null || !isFinite(v) ? '—' : v.toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%',
  date: d => d ? d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) : '—',
  dt: d => d ? d.toLocaleString('th-TH', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' น.' : '—',
  monthLabel: k => { if (!k) return '—'; const [y, m] = k.split('-'); const name = U.TH_MONTHS[+m - 1][0]; return y ? `${name} ${+y + 543}` : name; }
};

/* =====================================================================
 * 3) CENTRALIZED COLUMN MAPPING (ไทย/อังกฤษ) — ลำดับมีผล: ข้อแรกที่ตรงชนะ
 * ===================================================================== */
const FIELD_RULES = [
  { f: 'avgPolicy',  label: 'Avg/Policy',          num: true,  re: /avg.*polic|เฉลี่ย.*(กรมธรรม์|เคส)/i },
  { f: 'avgDay',     label: 'Avg/Day',             num: true,  re: /avg.*day|เฉลี่ย.*วัน/i },
  { f: 'avgTeam',    label: 'Avg/Team',            num: true,  re: /avg.*team|เฉลี่ย.*ทีม/i },
  { f: 'avgEvent',   label: 'Avg/Events',          num: true,  re: /avg.*event|เฉลี่ย.*(กิจกรรม|งาน)/i },
  { f: 'teams',      label: 'Team',                num: true,  re: /^teams?\b|จำนวนทีม|^ทีม/i },
  { f: 'events',     label: 'Events',              num: true,  re: /^events?\b|จำนวน(กิจกรรม|ครั้ง|งาน)|^กิจกรรม/i },
  { f: 'eventName',  label: 'ชื่อกิจกรรม',           num: false, re: /ชื่อกิจกรรม|ชื่องาน|event\s*name|^events?$|^กิจกรรม$|campaign|แคมเปญ|โครงการ/i },
  { f: 'fyp',        label: 'FYP Credit',          num: true,  re: /fyp|first\s*year|เครดิต|credit|เบี้ยประกัน|เบี้ยปีแรก|premium|\bape\b/i },
  { f: 'sumInsured', label: 'ทุนประกัน',            num: true,  re: /ทุนประกัน|ทุนประกันภัย|sum\s*(insured|assured)|\bs\.?a\.?\b/i },
  { f: 'target',     label: 'เป้าหมาย',             num: true,  re: /เป้า|target|goal/i },
  { f: 'cases',      label: 'จำนวนเคส',             num: true,  re: /เคส|cases?\b|กรมธรรม์|polic(y|ies)|ใบคำขอ|no\.?\s*of\s*app/i },
  { f: 'booths',     label: 'จำนวนบูธ',             num: true,  re: /จำนวน\s*บู[ธท]|booths?\b/i },
  { f: 'daysDone',   label: 'จำนวนวันที่จัดแล้ว',    num: true,  re: /จัดแล้ว|days?\s*done|วันที่ดำเนินการ/i },
  { f: 'daysTotal',  label: 'จำนวนวันทั้งหมด',       num: true,  re: /จำนวนวันทั้งหมด|จำนวนวัน|total\s*days|days\b/i },
  { f: 'progress',   label: 'ความคืบหน้า (%)',       num: true,  re: /ความคืบหน้า|progress|%\s*complete/i },
  { f: 'installed',  label: 'ติดตั้ง/รื้อถอนแล้ว',    num: true,  re: /ติดตั้ง|รื้อถอน|install/i },
  { f: 'remaining',  label: 'คงเหลือ',               num: true,  re: /คงเหลือ|remaining/i },
  { f: 'participants', label: 'ผู้เข้าร่วม',          num: true,  re: /ผู้เข้าร่วม|ผู้เข้าชม|participant|visitor|leads?\b|ผู้สนใจ/i },
  { f: 'mall',       label: 'ศูนย์การค้า',           num: false, re: /ศูนย์การค้า|ศูนย์|shopping\s*mall|\bmall\b|ห้าง/i },
  { f: 'branchCode', label: 'รหัสสาขา',             num: false, re: /รหัสสาขา|branch\s*(code|id)|store\s*(code|id)/i },
  { f: 'branch',     label: 'สาขา/บูธ',              num: false, re: /สาขา|branch|สถานที่|location|venue|บู[ธท]/i },
  { f: 'province',   label: 'จังหวัด',               num: false, re: /จังหวัด|province/i },
  { f: 'startDate',  label: 'วันที่เริ่ม',            num: false, re: /วันที่เริ่ม|เริ่ม|start/i },
  { f: 'endDate',    label: 'วันที่สิ้นสุด',          num: false, re: /สิ้นสุด|ถึงวันที่|\bend\b|finish/i },
  { f: 'date',       label: 'วันที่',                num: false, re: /วันที่|วันจัด|\bdate\b/i },
  { f: 'month',      label: 'เดือน',                 num: false, re: /เดือน|month|period|งวด/i },
  { f: 'year',       label: 'ปี',                    num: false, re: /^ปี|\byear\b|พ\.ศ\./i },
  { f: 'insType',    label: 'ประเภทประกัน/แผน',      num: false, re: /ประเภทประกัน|แบบประกัน|ผลิตภัณฑ์|insurance|product|plan/i },
  { f: 'areaType',   label: 'ประเภทพื้นที่',          num: false, re: /ประเภทพื้นที่|พื้นที่|ประเภท|area|zone|โซน|type/i },
  { f: 'lv',         label: 'LV',                    num: false, re: /\blv\b/i },
  { f: 'status',     label: 'สถานะ',                 num: false, re: /สถานะ|status/i },
  { f: 'rowId',      label: 'Source Row ID',          num: false, re: /^(no\.?|id|ลำดับ|row\s*id|รหัส.*)$/i }
];
const SUMMARY_RE = /^(รวม|ยอดรวม|ผลรวม|grand\s*total|sub\s*-?\s*total|total|sum)(?![a-z])/i;

/** หาแถว Header: แถวแรกที่ส่วนใหญ่เป็นข้อความ (≥2 ช่อง) */
function detectHeaderRow(values) {
  const lim = Math.min(values.length, 15);
  for (let r = 0; r < lim; r++) {
    let text = 0, nonEmpty = 0;
    values[r].forEach(v => {
      if (U.isEmpty(v)) return; nonEmpty++;
      if (typeof v === 'string' && U.num(v) === null) text++;
    });
    if (text >= 2 && text >= 0.6 * nonEmpty) return r;
  }
  return -1;
}

/** ประมวลผลแท็บหนึ่ง → headers, mapping, records, skipped, data quality */
function processSheet(sh, opts) {
  const V = sh.values || [], D = sh.display || [];
  const out = { name: sh.name, gid: sh.gid, hidden: sh.hidden, truncated: sh.truncated, headerRow: -1, headers: [], map: {}, dict: [], records: [], skipped: [], summaryRows: [], dupCount: 0, totalRows: 0, all: [], badDates: [] };
  if (!V.length) return out;
  const hr = detectHeaderRow(V); out.headerRow = hr;
  if (hr < 0) return out;
  const width = Math.max(...V.map(r => r.length));
  // parent header (หัวตารางสองชั้น) ใช้เมื่อแถวบนมีข้อความ ≥2 ช่อง
  let parent = null;
  if (hr > 0) {
    const up = V[hr - 1]; const t = up.filter(v => typeof v === 'string' && v.trim()).length;
    if (t >= 2) { let last = ''; parent = up.map(v => (typeof v === 'string' && v.trim()) ? (last = U.norm(v)) : last); }
  }
  for (let c = 0; c < width; c++) {
    const child = U.norm(D[hr] && D[hr][c] != null ? D[hr][c] : V[hr][c]);
    const p = parent && parent[c];
    out.headers.push(child ? (p && p !== child ? p + ' › ' + child : child) : (p || ''));
  }
  const dataRows = [];
  for (let r = hr + 1; r < V.length; r++) dataRows.push(r);

  const numericShare = c => {
    let ne = 0, nn = 0;
    dataRows.forEach(r => { const v = V[r][c]; if (U.blankish(v)) return; ne++; if (U.num(v) !== null) nn++; });
    return ne ? nn / ne : 0;
  };
  // จับคู่คอลัมน์จากชื่อ Header
  const taken = new Set();
  const cand = {};
  out.headers.forEach((h, c) => {
    if (!h) return;
    const rule = FIELD_RULES.find(x => x.re.test(h) && (!x.num || numericShare(c) >= 0.5)) || FIELD_RULES.find(x => x.re.test(h));
    if (rule) (cand[rule.f] = cand[rule.f] || []).push(c);
  });
  FIELD_RULES.forEach(rule => {
    let cols = cand[rule.f]; if (!cols) return;
    if (rule.f === 'fyp') {
      // หลายคอลัมน์เข้าข่าย FYP → เลือก "FYP Credit" ก่อน แล้วค่อย Credit, FYP, เบี้ย/Premium
      const sc = c => { const h = out.headers[c]; if (CONFIG.fypHeader && U.key(h) === U.key(CONFIG.fypHeader)) return 9; return /fyp.*credit|credit.*fyp/i.test(h) ? 4 : /credit|เครดิต/i.test(h) ? 3 : /fyp|first\s*year/i.test(h) ? 2 : 1; };
      cols = [...cols].sort((a, b) => sc(b) - sc(a) || a - b);
    }
    for (const c of cols) {
      if (taken.has(c)) continue;
      if (rule.num && numericShare(c) < 0.5) { out.dict.push({ col: c, header: out.headers[c], field: rule.f, label: rule.label, status: 'bad', note: 'ชื่อตรงแต่ข้อมูลส่วนใหญ่ไม่ใช่ตัวเลข — ไม่ใช้คำนวณ' }); continue; }
      if (out.map[rule.f] == null) { out.map[rule.f] = c; taken.add(c); out.dict.push({ col: c, header: out.headers[c], field: rule.f, label: rule.label, status: 'good', note: rule.num ? `ตัวเลข ${Math.round(numericShare(c) * 100)}% ของแถว` : 'ข้อความ' }); }
      else out.dict.push({ col: c, header: out.headers[c], field: rule.f, label: rule.label, status: 'warn', note: `ชื่อซ้ำกับคอลัมน์ ${U.colLetter(out.map[rule.f])} — ใช้คอลัมน์แรกเท่านั้น` });
    }
  });
  // ตรวจจากค่า: คอลัมน์ที่ค่าส่วนใหญ่เป็นชื่อเดือน → month
  if (out.map.month == null) {
    for (let c = 0; c < width; c++) {
      if (taken.has(c)) continue;
      let ne = 0, mm = 0;
      dataRows.forEach(r => { const v = V[r][c]; if (U.isEmpty(v) || typeof v === 'number') return; ne++; if (U.monthOf(v)) mm++; });
      if (ne >= 2 && mm / ne >= 0.6) { out.map.month = c; taken.add(c); out.dict.push({ col: c, header: out.headers[c] || '(ไม่มีชื่อ)', field: 'month', label: 'เดือน', status: 'good', note: 'ตรวจพบจากค่าที่เป็นชื่อเดือน' }); break; }
    }
  }
  // คอลัมน์ที่ไม่ได้จับคู่
  out.headers.forEach((h, c) => { if (!taken.has(c) && !out.dict.some(d => d.col === c) && (h || dataRows.some(r => !U.isEmpty(V[r][c])))) out.dict.push({ col: c, header: h || '(ไม่มีชื่อ)', field: '', label: '—', status: 'neutral', note: 'ไม่ได้ใช้ในการคำนวณ (แสดงในตารางต้นฉบับ)' }); });
  out.dict.sort((a, b) => a.col - b.col);

  // แปลงแถวเป็น records
  const M = out.map;
  const labelCols = [0, 1, 2, 3, M.mall, M.branch].filter(c => c != null);
  const seen = new Map();
  dataRows.forEach(r => {
    const row = V[r], disp = D[r] || [];
    const nonEmpty = row.filter(v => !U.isEmpty(v)).length;
    if (!nonEmpty) return; // แถวว่างไม่นับ
    out.totalRows++;
    const sheetRow = r + 1;
    out.all.push({ _row: sheetRow, _disp: disp, _tab: sh.name });
    const isSummary = labelCols.some(c => typeof row[c] === 'string' && SUMMARY_RE.test(U.norm(row[c])));
    if (isSummary) { out.skipped.push({ row: sheetRow, reason: 'แถวสรุป (รวม/Total) — ไม่บวกซ้ำ', disp }); out.summaryRows.push({ row: sheetRow, values: row }); return; }
    const g = f => M[f] == null ? undefined : row[M[f]];
    const rec = { _tab: sh.name, _row: sheetRow, _disp: disp, _raw: row };
    ['fyp', 'sumInsured', 'target', 'cases', 'booths', 'teams', 'events', 'avgPolicy', 'avgDay', 'avgTeam', 'avgEvent', 'daysDone', 'daysTotal', 'progress', 'installed', 'remaining', 'participants'].forEach(f => { if (M[f] != null) rec[f] = U.num(g(f)); });
    ['branch', 'branchCode', 'province', 'insType', 'areaType', 'eventName', 'lv', 'status', 'rowId'].forEach(f => { if (M[f] != null) rec[f] = U.norm(g(f)) || null; });
    if (M.mall != null) { rec.mallRaw = U.norm(g('mall')) || null; rec.mall = rec.mallRaw; }
    if (rec.progress != null && rec.progress > 1.5) rec.progress = rec.progress / 100;
    // วันที่/เดือน/ปี
    // วันที่: อ่านจากชีต → ถ้าปีอยู่นอกช่วง 2558–2583 (ค.ศ. 2015–2040) ถือว่าผิด ไม่นำไปจัดกลุ่มรายเดือน
    const bad = [];
    const rd = f => { if (M[f] == null || U.isEmpty(g(f))) return null; const d = U.date(g(f)); if (d && !U.validDate(d)) bad.push(`${out.headers[M[f]]}: "${disp[M[f]] || ''}"`); return U.validDate(d); };
    rec.date = rd('date'); rec.start = rd('startDate'); rec.end = rd('endDate');
    const anyDate = rec.date || rec.start || rec.end;
    let mo = null, yr = null;
    if (M.month != null && !U.isEmpty(g('month'))) {
      const mv = g('month'), md = U.date(mv);
      if (md) { if (U.validDate(md)) { mo = md.getMonth() + 1; yr = md.getFullYear(); } else bad.push(`${out.headers[M.month]}: "${disp[M.month] || ''}"`); }
      else {
        mo = U.monthOf(mv);
        const s2 = U.norm(disp[M.month] || mv), ym = s2.match(/(\d{4}|\d{2})\s*$/);
        if (mo && ym) { const y2 = U.toAD(+ym[1]); if (U.validYear(y2)) yr = y2; else { bad.push(`${out.headers[M.month]}: "${s2}"`); mo = null; } }
      }
    }
    if (M.year != null && !U.isEmpty(g('year'))) { const y = U.toAD(U.num(g('year'))); if (U.validYear(y)) yr = y; else bad.push(`${out.headers[M.year]}: "${disp[M.year] || ''}"`); }
    if (!mo && anyDate) mo = anyDate.getMonth() + 1;
    if (!yr && anyDate) yr = anyDate.getFullYear();
    // วันที่ช่องใดช่องหนึ่งผิด → ไม่จัดเข้าเดือนใดเลย (ไม่เดาจากช่องอื่น)
    if (bad.length) { rec._badDate = bad.join(', '); out.badDates.push({ row: sheetRow, note: rec._badDate }); mo = null; yr = null; }
    rec.month = mo || null; rec.year = yr || null;
    rec.monthKey = mo ? `${yr || ''}-${String(mo).padStart(2, '0')}` : null;
    if (rec.start && rec.end) rec.days = Math.round((rec.end - rec.start) / 864e5) + 1;
    // ข้ามแถวที่ไม่มีทั้งตัวระบุและตัวเลข
    const hasId = rec.mall || rec.branch || rec.insType || rec.areaType || rec.monthKey || rec.lv;
    const hasNum = ['fyp', 'sumInsured', 'cases', 'booths', 'target', 'participants'].some(f => rec[f] != null);
    if (!hasId && !hasNum) { out.skipped.push({ row: sheetRow, reason: 'ไม่มีตัวระบุและไม่มีตัวเลขที่ใช้คำนวณ', disp }); return; }

function stackedLabels(chart, o) {

    if (!alpha) return;

        meta.data.forEach((el, i) => { const txt = ds.data[i] == null ? '' : o.fmt(ds.data[i], i); if (txt) { const w = ctx.measureText(txt).width; const x = Math.min(Math.max(el.x, chartArea.left + w / 2), chartArea.right - w / 2); halo(ctx, txt, x, el.y - 8); } });

        ctx.fillStyle = raw == null ? '#8590a6' : '#101a2e';
        const w = ctx.measureText(txt).width;
        if (horiz) {

const CI_DIMS = [
  { id: 'gender',  title: 'เพศ',               re: /^เพศ|gender|^sex/i },
  { id: 'age',     title: 'อายุ',              re: /^อายุ|^age\b/i },
  { id: 'income',  title: 'รายได้',             re: /รายได้|income|เงินเดือน/i },
  { id: 'policy',  title: 'การถือกรมธรรม์',      re: /กรมธรรม์|ประกัน(ที่มี|ชีวิตที่มี|เดิม)|มีประกัน|policy/i },
  { id: 'marital', title: 'สถานภาพ',            re: /สถานภาพ|สถานะ(ครอบครัว|สมรส)|marital/i },
  { id: 'kids',    title: 'จำนวนบุตร',          re: /บุตร|ลูก|children|kids/i },
  { id: 'job',     title: 'อาชีพ',              re: /อาชีพ|occupation|job/i },
  { id: 'reason',  title: 'เหตุผลในการทำประกัน',  re: /เหตุผล|reason|วัตถุประสงค์/i }
];
// แถวที่ชีตเติมเพื่อให้ยอดครบฐาน (เช่น "อายุอื่น ๆ / คำตอบที่ไม่แสดงใน Top 5") — ไม่ใช่คำตอบลูกค้าจริง จึงไม่แสดง
const CI_PAD_RE = /ไม่แสดง|คำตอบอื่น|ส่วนที่เหลือ|เติมยอด|not\s*shown|remaining|^\S*อื่น\s*ๆ?\s*\//i;
function readCustomer(t) {
  if (!t) return null;
  const V = t._V || [], H = t.headers || [], hr = t.headerRow;
  const out = { mode: null, dims: {}, n: null, notes: [], raw: null };
  // (ก) รายคน: แถวหัวมีคอลัมน์ตรงหมวด ≥ 3 และข้อมูล ≥ 20 แถว
  const cols = {}; CI_DIMS.forEach(d => { const c = H.findIndex(h => h && d.re.test(U.norm(h)) && !/จำนวน|%|สัดส่วน/.test(h)); if (c >= 0) cols[d.id] = c; });
  const dataRows = hr >= 0 ? V.slice(hr + 1).filter(r => r.some(v => !U.isEmpty(v)) && !r.some(v => typeof v === 'string' && SUMMARY_RE.test(U.norm(v)))) : [];
  if (Object.keys(cols).length >= 3 && dataRows.length >= 20) {
    out.mode = 'raw'; out.n = dataRows.length; out.raw = { rows: dataRows, cols };
    Object.entries(cols).forEach(([id, c]) => { const m = new Map(); let blank = 0; dataRows.forEach(r => { const v = r[c] instanceof Object && r[c].d ? r[c].d : r[c]; const k = U.norm(v); if (!k) { blank++; return; } if (CI_PAD_RE.test(k)) return; m.set(k, (m.get(k) || 0) + 1); }); out.dims[id] = { items: [...m.entries()].map(([label, n]) => ({ label, n })), blank }; });
  } else {
    // (ข) ตารางสรุป: หาเซลล์หัวข้อหมวด แล้วอ่าน ค่า|จำนวน ด้านล่างจนเจอแถวว่าง
    out.mode = 'summary';
    const used = new Set();
    CI_DIMS.forEach(d => {
      for (let r = 0; r < V.length && !out.dims[d.id]; r++) for (let c = 0; c < (V[r] || []).length; c++) {
        const hv = V[r][c]; if (typeof hv !== 'string' || hv.length > 40 || !d.re.test(U.norm(hv)) || used.has(r + ':' + c)) continue;
        const items = []; let total = null;
        for (let rr = r + 1; rr < V.length; rr++) {
          const row = V[rr] || [], lab = row[c];
          const label = lab && lab.d ? lab.d : U.norm(lab);
          if (!label && typeof lab !== 'number') break;
          if (typeof lab === 'string' && CI_DIMS.some(x => x !== d && x.re.test(label) && label.length < 25)) break;
          // จำนวน = ตัวเลขจำนวนเต็มตัวแรกทางขวา (ข้ามคอลัมน์ %)
          let n = null; for (let cc = c + 1; cc <= c + 4 && cc < row.length; cc++) { const v = U.num(row[cc]); const disp = String((t._D[rr] || [])[cc] || ''); if (v != null && !/%/.test(disp) && Number.isInteger(v)) { n = v; break; } }
          if (n == null) continue;
          if (SUMMARY_RE.test(String(label))) { total = n; continue; }
          if (CI_PAD_RE.test(String(label))) { out.padded = (out.padded || 0) + 1; continue; }
          items.push({ label: String(label), n });
        }
        if (items.length) { used.add(r + ':' + c); out.dims[d.id] = { items, total, blank: 0, at: `แถว ${r + 1} คอลัมน์ ${U.colLetter(c)}` }; }
      }
    });
    const g = out.dims.gender; out.n = g ? (g.total ?? g.items.reduce((a, x) => a + x.n, 0)) : null;

}

function findNote(t, re) {
  if (!t) return null; const V = t._V || [];
  for (let r = 0; r < V.length; r++) for (let c = 0; c < (V[r] || []).length; c++) {
    const v = V[r][c]; if (typeof v !== 'string' || !re.test(v)) continue;
    const right = (t._D[r] || []).slice(c + 1, c + 4).map(U.norm).find(Boolean);
    return { text: U.norm(v), value: right || null, at: `${t.name} แถว ${r + 1}` };
  }
  return null;
}

  branch() {
    const m = S.model, src = m.sheetFor(/branch\s*detail/i);
    const t = src && (has(src, 'branch') || has(src, 'mall')) ? src : m.primary;
    if (!t) { $('view').innerHTML = missingBox('รายละเอียดสาขา', ['ไม่พบแท็บ “Branch Detail” หรือข้อมูลรายสาขา']); return; }
    const st = S.tableState, { rows, ignored } = applyFilters(t);
    const div = (a, b) => a != null && b ? a / b : null;
    // ค่าเฉลี่ยรายสาขา: ใช้ค่าในชีตถ้ามีคอลัมน์ ไม่งั้นคำนวณจากยอดรวม ÷ ตัวหาร
    const days = r => r.daysTotal ?? r.days ?? null;
    const B = rows.map(r => ({ r, mall: r.mall || '—', branch: branchLabel(r), teams: r.teams ?? null, events: r.events ?? null, days: days(r), fyp: r.fyp ?? null, pol: r.cases ?? null,
      aPol: r.avgPolicy ?? div(r.fyp, r.cases), aDay: r.avgDay ?? div(r.fyp, days(r)), aTeam: r.avgTeam ?? div(r.fyp, r.teams), aEvt: r.avgEvent ?? div(r.fyp, r.events) }));
    const S2 = k => { const v = B.filter(x => x[k] != null); return v.length ? v.reduce((a, x) => a + x[k], 0) : null; };
    const T = { teams: S2('teams'), events: S2('events'), days: S2('days'), fyp: S2('fyp'), pol: S2('pol') };
    // แถว Total: ค่าเฉลี่ย = ยอดรวม ÷ ตัวหารรวม (ไม่บวกค่าเฉลี่ยของแต่ละสาขา)
    T.aPol = div(T.fyp, T.pol); T.aDay = div(T.fyp, T.days); T.aTeam = div(T.fyp, T.teams); T.aEvt = div(T.fyp, T.events);
    const has2 = k => B.some(x => x[k] != null);
    const mFmtB = v => v == null ? '—' : F.n(v, 2);
    const stat = (l, v, u, tip, key, small) => `<div class="stat ${key ? 'key' : ''} ${small ? 'sm' : ''}"><div class="l">${l} ${tip ? tipI(tip) : ''}</div><div class="n">${v}<small>${u}</small></div></div>`;

    const top = st.brTop || 10;
    // th = ชื่อหัวข้อค่าในกล่องสรุป · share = ชื่อสัดส่วน (null = ไม่แสดงสัดส่วน)
    // Team ไม่แสดงสัดส่วน: ทีมเดียวกันอาจออกบูธหลายสาขา ผลรวมทีมจึงอาจนับซ้ำ · ค่าเฉลี่ยคิดเป็นสัดส่วนไม่ได้
    const BM = [['teams', 'Team', 0, 'ทีม', 'จำนวนทีม', null], ['events', 'Events', 0, 'ครั้ง', 'จำนวนกิจกรรม', 'สัดส่วนจำนวนกิจกรรมรวม'], ['days', 'Days', 0, 'วัน', 'จำนวนวัน', 'สัดส่วนจำนวนวันรวม'],
      ['fyp', 'FYP', 2, 'บาท', 'ยอด FYP', 'สัดส่วนยอด FYP รวม'], ['pol', 'Policies', 0, 'กรมธรรม์', 'จำนวนกรมธรรม์', 'สัดส่วนจำนวนกรมธรรม์รวม'],
      ['aPol', 'Avg/Policy', 2, 'บาท ต่อกรมธรรม์', 'FYP เฉลี่ยต่อกรมธรรม์', null], ['aDay', 'Avg/Day', 2, 'บาท ต่อวัน', 'FYP เฉลี่ยต่อวัน', null],
      ['aTeam', 'Avg/Team', 2, 'บาท ต่อทีม', 'FYP เฉลี่ยต่อทีม', null], ['aEvt', 'Avg/Events', 2, 'บาท ต่อกิจกรรม', 'FYP เฉลี่ยต่อกิจกรรม', null]]
      .map(([k, l, dec, unit, th, share]) => ({ k, l, dec, unit, th, share, avg: /^a[A-Z]/.test(k) }));
    const met = BM.find(x => x.k === st.brMetric) || BM.find(x => x.k === 'fyp');

    const focus = S.f.branch !== 'all' ? rkAll.find(x => mallBranch(x.r) === S.f.branch) || null : rkAll[0] || null;

  type() {
    const m = S.model, t = m.ds.type;
    if (!t) { $('view').innerHTML = missingBox('ประเภทพื้นที่', ['ต้องมีคอลัมน์ ประเภทพื้นที่ (หรือ พื้นที่ / Area / Zone / โซน) และ FYP Credit ในแท็บเดียวกัน']); closeAreaPanel(); return; }
    const st = S.tableState, { rows, ignored } = applyFilters(t);
    const dayOf = r => r.daysTotal ?? r.days ?? null;
    const sumF = (list, f) => { const v = list.map(f).filter(x => x != null); return v.length ? v.reduce((a, x) => a + x, 0) : null; };
    // ตัวชี้วัดที่มีข้อมูลจริงในชุดนี้เท่านั้น
    const AM = [['fyp', 'FYP Credit', 'บาท', 2, r => r.fyp], ['pol', 'จำนวนกรมธรรม์', 'กรมธรรม์', 0, r => r.cases], ['events', 'จำนวนกิจกรรม', 'กิจกรรม', 0, r => r.events]]
      .map(([k, l, unit, dec, get]) => ({ k, l, unit, dec, get })).filter(x => t.records.some(r => x.get(r) != null));
    const met = AM.find(x => x.k === st.areaMetric) || AM[0];
    const fmt = (v, d = met.dec) => v == null ? '—' : v.toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
    // สีประจำประเภทพื้นที่: เรียงชื่อทั้งหมดในแท็บ (ไม่ขึ้นกับตัวกรอง) → สีเดิมทุกครั้ง · เกิน 8 ประเภทใช้สีเทา
    const colorOf = a => areaColor(t, a);
    // จำนวนสาขาที่ออก: นับสาขาไม่ซ้ำ (สาขาเดิมหลายกิจกรรม = 1) · ใช้รหัสสาขาถ้ามี ไม่งั้นใช้ ศูนย์ + ชื่อสาขา + จังหวัด
    // ปรับมาตรฐานเฉพาะตัวพิมพ์/ช่องว่าง/จุด — ชื่อที่ต่างกันจริง (เช่น "บางแค" กับ "บางแค 2") นับเป็นคนละสาขา · ไม่มีข้อมูลสาขาเลย = null (แสดง —)
    const branchKey = r => r.branchCode ? 'code:' + U.key(r.branchCode) : (r.branch ? [mallKey(r.mall || ''), mallKey(r.branch), mallKey((r.province || '').replace(/^(จ\.|จังหวัด)\s*/, ''))].join('|') : null);
    const branchCount = list => { const k = new Set(list.map(branchKey).filter(Boolean)); return k.size ? k.size : null; };
    const groups = groupBy(rows, r => r.areaType).map(g => {
      const v = sumF(g.rows, met.get);
      return Object.assign(g, { v, fypT: sumF(g.rows, r => r.fyp), polT: sumF(g.rows, r => r.cases), evT: sumF(g.rows, r => r.events), dayT: sumF(g.rows, dayOf),
        branches: branchCount(g.rows), color: colorOf(g.key) });
    });
    const ranked = groups.filter(g => g.v != null).sort((a, b) => b.v - a.v);
    ranked.forEach((g, i) => g.rank = i && g.v === ranked[i - 1].v ? ranked[i - 1].rank : i + 1);
    const total = ranked.length ? ranked.reduce((a, g) => a + g.v, 0) : null;
    const pct = v => v != null && total ? F.pct(v / total * 100, 1) : '—';
    const top = ranked[0], low = ranked.length > 1 ? ranked[ranked.length - 1] : null;
    const h = Math.max(220, ranked.length * 44 + 40);
    const sel = groups.find(g => g.key === st.areaSel) ? st.areaSel : null;
    const seg = AM.map(x => `<button class="seg ${x.k === met.k ? 'on' : ''}" aria-pressed="${x.k === met.k}" onclick="S.tableState.areaMetric='${x.k}';renderView()">${x.l}</button>`).join('');

    $('view').innerHTML = `
    <div class="card"><div class="card-h"><div><h3>ตัวชี้วัด</h3><div class="cap">กราฟ อันดับ และสัดส่วนในหน้านี้คำนวณตามตัวชี้วัดที่เลือก</div>${ignored.length ? `<div class="na">ตัวกรอง ${ignored.join(', ')} ใช้กับข้อมูลชุดนี้ไม่ได้</div>` : ''}</div></div><div class="segs">${seg}</div></div>
    <div class="mini">
      <div class="stat key"><div class="l">ประเภทพื้นที่ผลงานสูงสุด · ${met.l}</div><div class="n" style="font-size:18px">${top ? U.esc(top.key) : '—'}</div><div class="l">${top ? fmt(top.v) + ' ' + met.unit + ' · ' + pct(top.v) : 'ไม่มีข้อมูล'}</div></div>
      <div class="stat"><div class="l">ประเภทพื้นที่ผลงานต่ำสุด · ${met.l}</div><div class="n" style="font-size:18px">${low ? U.esc(low.key) : '—'}</div><div class="l">${low ? fmt(low.v) + ' ' + met.unit + ' · ' + pct(low.v) : 'มีข้อมูลประเภทเดียว'}</div></div>
      <div class="stat"><div class="l">ยอดรวมทุกประเภท · ${met.l}</div><div class="n">${total == null ? '—' : cnt(total, met.dec)}<small>${met.unit}</small></div></div>
      <div class="stat"><div class="l">จำนวนประเภทพื้นที่ที่มีข้อมูล</div><div class="n">${cnt(ranked.length, 0)}<small>ประเภท</small></div></div>
    </div>
    <div class="card"><div class="card-h"><div><h3>เปรียบเทียบผลงานตามประเภทพื้นที่ · ${met.l}</h3><div class="cap">${met.unit} · % ของยอดรวม · คลิกแท่งเพื่อดูรายละเอียด</div></div></div>
      <div class="chart" style="height:${h}px">${ranked.length ? '<canvas id="cArea"></canvas>' : '<div class="empty">ไม่มีข้อมูลตามตัวกรอง</div>'}</div></div>
    <div class="card"><div class="card-h"><div><h3>ประเภทพื้นที่ทั้งหมด · ${F.n(groups.length)} ประเภท</h3><div class="cap">อันดับและ % ตาม ${met.l} · จำนวนสาขาที่ออกนับแต่ละสาขาครั้งเดียว · คลิกแถวเพื่อดูรายละเอียด</div></div></div><div id="tArea"></div></div>`;

    const cols = [

    <div class="card"><div class="card-h"><div><h3>FYP Credit ตามประเภทพื้นที่ แยกศูนย์การค้า</h3><div class="cap">บาท · เรียงตามยอดรวมของศูนย์ · ตัวเลขในแท่ง = ยอดของประเภทพื้นที่ · ท้ายแท่ง = ยอดรวมศูนย์ · คลิกชื่อประเภทเพื่อเน้น / คลิกแท่งเพื่อเน้นศูนย์</div></div></div>
