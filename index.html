  plan() {
    const m = S.model, st = S.tableState;
    const A = readPlanTab(m.sheetFor(/insurance\s*type\s*[–-]\s*all/i)), B = readPlanTab(m.sheetFor(/insurance\s*type\s*by/i));
    if (!A && !B) { $('view').innerHTML = missingBox('แบบประกัน', ['ไม่พบแท็บ “Insurance Type – All Shopping Malls” หรือ “Insurance Type by Shopping Mall” ที่มีคอลัมน์ชื่อแบบประกันและตัวเลข']); return; }
    const metrics = [...new Set([...(A ? A.metrics : []), ...(B ? B.metrics : [])])];
    const ML = { fyp: ['ยอด FYP', 'บาท', 2], pol: ['จำนวนกรมธรรม์', 'กรมธรรม์', 0] };
    const met = metrics.includes(st.planMet) ? st.planMet : metrics[0];
    const [mLabel, mUnit, mDec] = ML[met];
    const fmt = (v, d = mDec) => v == null ? '—' : v.toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
    const mallOK = ml => S.f.mall === 'all' || (ml && mallMatch(S.f.mall, ml));
    const agg = (rows, keyFn) => { const g = new Map(); rows.forEach(x => { const k = keyFn(x); const o = g.get(k) || { key: x.key, name: x.name, mall: x.mall, fyp: null, pol: null }; o[x.k] = (o[x.k] || 0) + x.v; g.set(k, o); }); return [...g.values()]; };
    const rank = (list, k) => { const r = list.filter(x => x[k] != null).sort((a, b) => b[k] - a[k]); r.forEach((x, i) => x.rank = i && x[k] === r[i - 1][k] ? r[i - 1].rank : i + 1); return r; };
    // สีประจำแบบประกัน: เรียงชื่อทุกแบบจากทั้งสองแท็บ → สีเดิมทุกครั้ง
    const allKeys = [...new Set([...(A ? A.rows : []), ...(B ? B.rows : [])].map(x => x.key))].sort();
    const mcolList = [...new Set((B ? B.rows : []).map(x => x.mall).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'th'));
    const mcol = ml => { const i = mcolList.indexOf(ml); return i >= 0 && i < COLORS.length ? COLORS[i] : '#94a3b8'; };
    const pcol = k => { const i = allKeys.indexOf(k); return i >= 0 && i < PLAN_COLORS.length ? PLAN_COLORS[i] : '#94a3b8'; };
    // 1) อันดับรวมทุกศูนย์ จากแท็บ All (ถ้าไม่มี ใช้ผลรวมจากแท็บแยกศูนย์ และแจ้งไว้)
    const srcAll = A && A.rows.length ? A : B;
    const allRows = srcAll ? srcAll.rows.filter(x => srcAll === A ? true : mallOK(x.mall)) : [];
    const overall = rank(agg(allRows, x => x.key), met);
    const tot = overall.reduce((a, x) => a + x[met], 0);
    // 2) Top 3 ในแต่ละศูนย์ จากแท็บแยกศูนย์ (อันดับภายในศูนย์)
    const byMallRows = B ? B.rows.filter(x => x.mall && mallOK(x.mall)) : [];
    const malls = [...new Set(byMallRows.map(x => x.mall))].map(ml => { const list = agg(byMallRows.filter(x => x.mall === ml), x => x.key); return { mall: ml, top: rank(list, met).slice(0, 3), fyp: list.reduce((a, x) => a + (x.fyp || 0), 0), any: list.some(x => x.fyp != null) }; })
      .sort((a, b) => (b.any ? b.fyp : -1) - (a.any ? a.fyp : -1));
    const q = (st.planQ || '').trim().toLowerCase();
    const mallsShown = q ? malls.filter(x => x.mall.toLowerCase().includes(q)) : malls;
    // 3) ตารางเปรียบเทียบ: แถว = แบบ, คอลัมน์ = ศูนย์
    const cell = new Map(); byMallRows.filter(x => x.k === met).forEach(x => { const k = x.key + '\u0001' + x.mall; cell.set(k, (cell.get(k) || 0) + x.v); });
    const plans = rank(agg(byMallRows, x => x.key), met);
    const pq = (st.planP || '').trim().toLowerCase();
    const plansShown = pq ? plans.filter(x => x.name.toLowerCase().includes(pq)) : plans;
    const mallCols = malls.map(x => x.mall), vmax = Math.max(0, ...cell.values());
    const heat = v => { if (v == null || !vmax) return ''; const k = v / vmax; return `background:rgba(13,148,136,${(0.08 + k * 0.7).toFixed(2)});color:${k > 0.62 ? '#fff' : 'var(--text)'}`; };
    const seg = metrics.map(k => `<button class="seg ${k === met ? 'on' : ''}" aria-pressed="${k === met}" onclick="S.tableState.planMet='${k}';renderView()">${ML[k][0]}</button>`).join('');
    const issues = [...(A ? A.issues : []), ...(B ? B.issues : [])];
    const rb = n => `<span class="rk r${n}">${n}</span>`;

    $('view').innerHTML = `
    <div class="card"><div class="card-h"><div><h3>ตัวชี้วัด</h3><div class="cap">อันดับทุกส่วนในหน้านี้คำนวณตามตัวชี้วัดที่เลือก (ยอด FYP และจำนวนกรมธรรม์แยกกัน ไม่ใช้แทนกัน)</div>${S.f.mall !== 'all' && srcAll === A ? '<div class="na">อันดับทุกศูนย์ใช้แท็บรวมทุกศูนย์ จึงไม่กรองตามศูนย์การค้า</div>' : ''}</div></div><div class="segs">${seg}</div></div>
    ${issues.length ? `<div class="banner warn"><b>รายการที่ต้องตรวจสอบในชีต</b>${issues.slice(0, 5).map(U.esc).join(' · ')}${issues.length > 5 ? ' …' : ''}</div>` : ''}

    <div class="card"><div class="card-h"><div><h3>อันดับแบบประกันยอดนิยมทุกศูนย์การค้า</h3><div class="cap">${mLabel} (${mUnit}) · ${F.n(overall.length)} แบบ · ${srcAll === A ? 'จากแท็บ Insurance Type – All Shopping Malls' : 'รวมจากแท็บแยกศูนย์ (ไม่พบแท็บรวมทุกศูนย์)'}</div></div></div>
      <div class="chart" style="height:${Math.max(220, overall.length * 36 + 50)}px">${overall.length ? '<canvas id="cPlan"></canvas>' : '<div class="empty">ไม่มีข้อมูล</div>'}</div></div>

    <div class="card"><div class="card-h"><div><h3>สัดส่วน${mLabel} ตามแบบประกัน</h3><div class="cap">${mLabel} (${mUnit}) · ${F.n(overall.length)} แบบ</div></div></div>
      ${donutBox('dPlanAll', '', 'ฐาน: ' + mLabel + ' ทุกแบบประกันรวมทุกศูนย์การค้า', overall.map(x => ({ name: x.name, v: x[met], color: pcol(x.key) })), fmt, mUnit)}</div>

    ${B ? `<div class="card"><div class="card-h"><div><h3>แบบประกันยอดนิยม 3 อันดับแรก แยกตามศูนย์การค้า</h3><div class="cap">อันดับภายในแต่ละศูนย์ · ${mLabel} · ศูนย์เรียงตามยอด FYP รวม · คลิกการ์ดเพื่อเน้นศูนย์ในตาราง</div></div>
        ${malls.length > 6 ? `<input id="planQ" class="srch" type="search" placeholder="ค้นหาศูนย์การค้า…" value="${U.esc(st.planQ || '')}">` : ''}</div>
      <div class="mcards">${mallsShown.length ? mallsShown.map(x => `<div class="mcard ${st.planM === x.mall ? 'on' : ''}" tabindex="0" data-mall="${U.esc(x.mall)}">
        <div class="mc-h"><b>${U.esc(x.mall)}</b><span class="na">FYP ${x.any ? fmt(x.fyp, 2) : '—'}</span></div>
        ${x.top.length ? `<ol>${x.top.map(p => `<li>${rb(Math.min(p.rank, 3))}<span class="pn"><i class="adot" style="background:${pcol(p.key)}"></i>${U.esc(p.name)}</span><b>${fmt(p[met])}</b></li>`).join('')}</ol>` : '<div class="na">ไม่มีข้อมูล</div>'}
      </div>`).join('') : '<div class="empty">ไม่พบศูนย์การค้า</div>'}</div>
      ${(() => {
        const cur = malls.find(x => x.mall === st.planM) || malls[0]; if (!cur) return '';
        const allList = rank(agg(byMallRows.filter(x => x.mall === cur.mall), x => x.key), met);
        const base = st.planBase === 'all' ? 'all' : 'top3';
        const items = base === 'top3' ? cur.top.map(p => ({ name: p.name, v: p[met], color: pcol(p.key) }))
          : allList.slice(0, 3).map(p => ({ name: p.name, v: p[met], color: pcol(p.key) })).concat(allList.length > 3 ? [{ name: 'แบบประกันอื่นๆ (' + (allList.length - 3) + ' แบบ)', v: allList.slice(3).reduce((a, p) => a + p[met], 0), color: '#cbd5e1' }] : []);
        return `<div class="subbox"><div class="card-h"><div><h4>${U.esc(cur.mall)} · สัดส่วน${mLabel}</h4><div class="cap">คลิกการ์ดศูนย์ด้านบนเพื่อเปลี่ยนศูนย์</div></div>
          <div class="segs"><button class="seg ${base === 'top3' ? 'on' : ''}" onclick="S.tableState.planBase='top3';renderView()">ภายใน Top 3</button><button class="seg ${base === 'all' ? 'on' : ''}" onclick="S.tableState.planBase='all';renderView()">เทียบทุกแบบของศูนย์</button></div></div>
          ${donutBox('dPlanMall', '', base === 'top3' ? 'ฐาน: ' + mLabel + ' ของแบบประกัน Top 3 ภายใน ' + cur.mall + ' (สัดส่วนภายใน Top 3 ไม่ใช่ทั้งศูนย์)' : 'ฐาน: ' + mLabel + ' ทุกแบบประกันของ ' + cur.mall + ' ตามแท็บแยกศูนย์', items, fmt, mUnit)}</div>`;
      })()}
    </div>

    <div class="card compact"><div class="card-h"><div><h3>ตารางเปรียบเทียบผลงานแบบประกันระหว่างศูนย์การค้า</h3><div class="cap">${mLabel} (${mUnit}) · สีเข้ม = ผลงานสูง (เกณฑ์เดียวทั้งตาราง) · — = ไม่มีข้อมูล</div></div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><input id="planP" class="srch" type="search" placeholder="ค้นหาแบบประกัน…" value="${U.esc(st.planP || '')}"><div class="scale"><span>ต่ำ</span><i style="background:linear-gradient(90deg,rgba(13,148,136,.08),rgba(13,148,136,.78))"></i><span>สูง</span></div></div></div>
      <div class="tbl-wrap"><table class="heat"><thead><tr><th style="cursor:default">อันดับ</th><th style="cursor:default">แบบประกัน</th>${mallCols.map(ml => `<th class="num ${st.planM === ml ? 'hl' : ''}" style="cursor:default">${U.esc(ml)}</th>`).join('')}<th class="num" style="cursor:default">รวม</th></tr></thead>
      <tbody>${plansShown.map(p => `<tr><td>${p.rank ? rb(Math.min(p.rank, 4)) : '—'}</td><td style="white-space:normal"><i class="adot" style="background:${pcol(p.key)}"></i>${U.esc(p.name)}</td>${mallCols.map(ml => { const v = cell.get(p.key + '\u0001' + ml); return `<td class="num ${st.planM && st.planM !== ml ? 'dimc' : ''}" style="${heat(v)}">${fmt(v)}</td>`; }).join('')}<td class="num"><b>${fmt(p[met])}</b></td></tr>`).join('')}</tbody>
      <tfoot><tr class="total"><td></td><td>รวม</td>${mallCols.map(ml => { const v = [...cell.entries()].filter(([k]) => k.endsWith('\u0001' + ml)).reduce((a, [, x]) => a + x, 0); return `<td class="num">${fmt(v)}</td>`; }).join('')}<td class="num">${fmt(plans.reduce((a, x) => a + (x[met] || 0), 0))}</td></tr></tfoot></table></div>
      ${(() => {
        const cp = plans.find(x => x.key === st.planCmp) || plans[0]; if (!cp) return '';
        const items = mallCols.map(ml => ({ name: ml, v: cell.get(cp.key + '\u0001' + ml) ?? null, color: mcol(ml) })).filter(x => x.v != null).sort((a, b) => b.v - a.v);
        return `<div class="subbox"><div class="card-h"><div><h4>สัดส่วน${mLabel} ของแบบประกันที่เลือก แยกตามศูนย์การค้า</h4></div>
          <div class="f" style="flex:0 1 280px"><label for="planCmp">แบบประกัน</label><select id="planCmp" onchange="S.tableState.planCmp=this.value;renderView()">${plans.map(x => `<option value="${U.esc(x.key)}" ${x.key === cp.key ? 'selected' : ''}>${U.esc(x.name)}</option>`).join('')}</select></div></div>
          ${donutBox('dPlanCmp', '', 'ฐาน: ' + mLabel + ' ของ ' + cp.name + ' รวมทุกศูนย์ในตารางนี้' + (mallCols.length > items.length ? ' · ศูนย์ที่ไม่มีข้อมูลแบบนี้ไม่แสดง' : ''), items, fmt, mUnit)}</div>`;
      })()}</div>`
    : missingBox('แบบประกันแยกตามศูนย์การค้า', ['ไม่พบแท็บ “Insurance Type by Shopping Mall”'])}
    ${lvDeepHTML(A)}`;

    if (overall.length) hbar('cPlan', overall.map(x => `${x.rank}. ${x.name}`), overall.map(x => x[met]), { colors: overall.map(x => x.rank <= 3 ? RANK_C[x.rank - 1] : '#7ea6e6'), label: mLabel, full: true, fmt: v => `${fmt(v)}${tot ? ' · ' + F.pct(v / tot * 100, 1) : ''}` });
    drawDonuts();
    const qi = $('planQ'); if (qi) qi.oninput = e => { st.planQ = e.target.value; const pos = e.target.selectionStart; renderView(); const n = $('planQ'); n.focus(); n.setSelectionRange(pos, pos); };
    const pi = $('planP'); if (pi) pi.oninput = e => { st.planP = e.target.value; const pos = e.target.selectionStart; renderView(); const n = $('planP'); n.focus(); n.setSelectionRange(pos, pos); };
    document.querySelectorAll('.mcard').forEach(c => { const go = () => { st.planM = st.planM === c.dataset.mall ? null : c.dataset.mall; renderView(); }; c.onclick = go; c.onkeydown = e => { if (e.key === 'Enter') go(); }; });
  },

  lv() {
    const m = S.model, t = m.lvTab;
    if (!t) { $('view').innerHTML = missingBox('LV', ['ไม่พบแท็บชื่อ “LV” ในชีต']); return; }
    const { rows, ignored } = applyFilters(t);
    const numFields = ['fyp', 'cases', 'sumInsured', 'target', 'participants'].filter(f => has(t, f));
    const stats = numFields.map(f => ({ f, label: FIELD_RULES.find(x => x.f === f).label, v: sum(rows, f) }));
    const byMall = has(t, 'mall') && has(t, 'fyp') ? mallAgg(rows) : [];
    const byMon = has(t, 'fyp') ? groupBy(rows, r => r.monthKey).sort((a, b) => monthCmp(a.key, b.key)) : [];
    const byType = has(t, 'insType') && has(t, 'fyp') ? groupBy(rows, r => r.insType).sort((a, b) => (b.fyp || 0) - (a.fyp || 0)) : [];
    const tgt = sum(rows, 'target');
    $('view').innerHTML = `
    <div class="banner info">หน้าเจาะลึกข้อมูลจากแท็บ “${U.esc(t.name)}” โดยตรง${ignoredNote(ignored) ? ' · ' + ignoredNote(ignored) : ''}</div>
    ${stats.length ? `<div class="mini">${stats.map(s => `<div class="stat"><div class="l">${s.label} (LV)</div><div class="n">${['fyp', 'sumInsured', 'target'].includes(s.f) ? F.mb(s.v) + '<small>ล้านบาท</small>' : F.n(s.v) + '<small>' + (s.f === 'cases' ? 'เคส' : 'คน') + '</small>'}</div></div>`).join('')}${tgt ? `<div class="stat"><div class="l">% สำเร็จ LV</div><div class="n">${F.pct(KPI.achievement(sum(rows, 'fyp'), tgt))}</div></div>` : ''}</div>` : `<div class="banner warn">แท็บ LV ไม่มีคอลัมน์ตัวเลขที่ระบบรู้จัก (FYP/เคส/ทุนประกัน/เป้า) — แสดงเป็นตารางต้นฉบับด้านล่าง</div>`}
    <div class="grid g2">
      ${byMon.length ? `<div class="card"><h3>FYP Credit LV รายเดือน</h3><div class="cap">ล้านบาท</div><div class="chart"><canvas id="cLvM"></canvas></div></div>` : ''}
      ${byMall.length ? `<div class="card"><h3>อันดับศูนย์การค้า (LV)</h3><div class="cap">ล้านบาท</div><div class="chart"><canvas id="cLvMall"></canvas></div></div>` : ''}
      ${byType.length ? `<div class="card"><h3>แผน/ประเภทที่เกี่ยวข้อง</h3><div class="cap">ล้านบาท</div><div class="chart"><canvas id="cLvT"></canvas></div></div>` : ''}
    </div>
    <div class="card">${rawTableHTML(t, 'rawLv', true)}</div>`;
    if (byMon.length) mkChart('cLvM', { type: 'bar', data: { labels: byMon.map(x => F.monthLabel(x.key)), datasets: [{ label: 'FYP LV', data: byMon.map(x => (x.fyp || 0) / 1e6), backgroundColor: COLORS[6], borderRadius: 4, maxBarThickness: 34 }] }, options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: gridOpt }, x: { grid: { display: false } } } } });
    if (byMall.length) hbar('cLvMall', byMall.map(x => x.key), byMall.map(x => (x.fyp || 0) / 1e6), { color: COLORS[6], onClick: App.drillMall });
    if (byType.length) hbar('cLvT', byType.map(x => x.key), byType.map(x => (x.fyp || 0) / 1e6), { color: COLORS[6] });
    drawRaw(t, 'rawLv');
  },

  part() {
    const m = S.model, t = m.sheetFor(/participant/i), C = readCustomer(t);
    if (!C || !Object.keys(C.dims).length) { $('view').innerHTML = missingBox('Insights ลูกค้า', ['ไม่พบหมวดข้อมูล (เพศ / อายุ / รายได้ / กรมธรรม์ / สถานภาพ / บุตร / อาชีพ / เหตุผล) ในแท็บ Participant Insights']); return; }
    const N = C.n, D = C.dims, F0 = v => F.n(v);
    const pc = n => N ? F.pct(n / N * 100, 1) : '—';
    // อันดับ 1 ของหมวด: ข้ามคำตอบรวม เช่น อื่นๆ / ไม่ระบุ
    const top = id => D[id] && D[id].items.find(x => !/^(อื่น|ไม่ระบุ|other|n\/a)/i.test(String(x.label))) || null;
    const colorMap = id => { const labs = D[id] ? D[id].items.map(x => x.label).slice().sort((a, b) => a.localeCompare(b, 'th')) : []; return l => { const i = labs.indexOf(l); return i >= 0 && i < COLORS.length ? COLORS[i] : '#94a3b8'; }; };
    // อายุ: ตรวจว่าเป็นอายุจริง (10–100) ไม่ใช่ปีเกิด แล้วจัดช่วง
    const ageItems = D.age ? D.age.items.map(x => ({ ...x, a: U.num(String(x.label).replace(/ปี/g, '')) })) : [];
    const ageOK = ageItems.length && ageItems.every(x => x.a != null && x.a >= 10 && x.a <= 100);
    // จัดช่วงอายุเฉพาะเมื่อข้อมูลอายุครบ (ผลรวม ≥ 95% ของผู้ตอบ) — ถ้าชีตมีแค่อันดับต้นๆ จะไม่จัดช่วง
    const ageSum = ageItems.reduce((a, x) => a + x.n, 0), ageFull = ageOK && N && ageSum >= 0.95 * N;
    const BINS = [['ต่ำกว่า 30 ปี', 0, 29], ['30–39 ปี', 30, 39], ['40–49 ปี', 40, 49], ['50–59 ปี', 50, 59], ['60 ปีขึ้นไป', 60, 200]];
    const bins = ageFull ? BINS.map(([l, lo, hi]) => ({ label: l, n: ageItems.filter(x => x.a >= lo && x.a <= hi).reduce((a, x) => a + x.n, 0) })) : [];
    const topBin = bins.slice().sort((a, b) => b.n - a.n)[0];
    // กรมธรรม์
    const pol = D.policy ? D.policy.items : [];
    const isNone = l => /^(ไม่มี|no|none|ไม่)/i.test(l);
    const none = pol.filter(x => isNone(x.label)).reduce((a, x) => a + x.n, 0);
    const has = pol.filter(x => !isNone(x.label)).reduce((a, x) => a + x.n, 0);
    const multi = id => D[id] && N && D[id].items.reduce((a, x) => a + x.n, 0) > N; // ผลรวมเกินฐาน = เลือกได้หลายข้อ
    const g = D.gender ? D.gender.items : [];
    const fem = g.find(x => /หญิง|female|^f$/i.test(x.label)), mal = g.find(x => /ชาย|male|^m$/i.test(x.label) && !/หญิง|female/i.test(x.label));
    const kcard = (l, v, u, d, key, txt) => `<div class="stat ${key ? 'key' : ''}"><div class="l" title="${l}">${l}</div><div class="n${txt ? ' t' : ''}">${v}${u ? `<small>${u}</small>` : ''}</div><div class="d" title="${String(d).replace(/<[^>]+>/g, '')}">${d}</div></div>`;
    const lst = (id, max) => D[id] ? D[id].items.slice(0, max || 99) : [];
    const barH = n => Math.max(200, n * 32 + 40);
    const box = (id, title, kind, note) => {
      if (!D[id]) return `<div class="card"><h3>${title}</h3><div class="empty">ไม่พบข้อมูลหมวดนี้ในชีต</div></div>`;
      const items = D[id].items, sumN = items.reduce((a, x) => a + x.n, 0), cm = colorMap(id);
      const useDonut = kind === 'donut' && !multi(id) && items.length <= 8;
      const shown = !multi(id) && N && sumN < N && C.mode !== 'raw' ? ` · รายการที่แสดงรวม ${F0(sumN)} คน (${pc(sumN)})` : '';
      const base = `ฐาน %: ผู้ตอบแบบสอบถามทั้งหมด ${N ? F0(N) + ' คน' : '—'}${shown}${multi(id) ? ' · เลือกได้มากกว่า 1 ข้อ สัดส่วนรวมอาจเกิน 100%' : C.mode === 'raw' && sumN < (N || 0) ? ` · ไม่ระบุ ${F0(N - sumN)} คน` : ''}`;
      return `<div class="card"><div class="card-h"><div><h3>${title}</h3><div class="cap">${note || ''}</div></div></div>
        ${useDonut ? donutBox('ci_' + id, '', base, items.map(x => ({ name: x.label, v: x.n, color: cm(x.label) })), F0, 'คน', N ? { pctBase: Math.max(N, sumN), center: [F0(N), 'คน ผู้ตอบทั้งหมด'] } : null)
          : `<div class="chart" style="height:${barH(items.length)}px"><canvas id="ci_${id}"></canvas></div><div class="na">${U.esc(base)}</div>`}</div>`;
    };
    // Business insights (ไม่มีอัตราปิดการขาย)
    const R = rankData(), fypM = R.metrics.find(x => x.id === 'fyp' && x.found), recM = R.metrics.find(x => x.id === 'recruit' && x.found);
    const topMall = fypM ? R.rows.filter(r => r.vals.fyp != null).sort((a, b) => b.vals.fyp - a.vals.fyp)[0] : null;
    const recruit = recM ? R.rows.reduce((a, r) => a + (r.vals.recruit || 0), 0) : null;
    const PA = readPlanTab(m.sheetFor(/insurance\s*type\s*[–-]\s*all/i));
    const bestPlan = PA ? (() => { const g2 = new Map(); PA.rows.filter(x => x.k === 'fyp').forEach(x => g2.set(x.name, (g2.get(x.name) || 0) + x.v)); return [...g2.entries()].sort((a, b) => b[1] - a[1])[0] || null; })() : null;
    const follow = findNote(t, /ติดตาม/) || m.tabs.map(x => findNote(x, /ช่วงติดตาม|ติดตามผล/)).find(Boolean);
    const topAge = ageOK ? ageItems.slice().sort((a, b) => b.n - a.n)[0] : top('age');
    const BI = [
      ['store', 'ศูนย์การค้าที่ทำ FYP สูงสุด', topMall ? U.esc(topMall.mall) : 'ไม่พบข้อมูล', topMall ? 'FYP ' + topMall.vals.fyp.toLocaleString('th-TH', { minimumFractionDigits: 2 }) + ' บาท (' + U.esc(fypM.src) + ')' : ''],
      ['cal', 'ช่วงติดตามผลงาน', follow ? U.esc(follow.value || follow.text) : 'ไม่พบข้อมูลในชีต', follow ? 'จากข้อความในชีต: “' + U.esc(follow.text) + '” (' + U.esc(follow.at) + ')' : 'ไม่พบข้อความที่ระบุช่วงติดตามในชีต'],
      ['coins', 'ช่วงรายได้ที่พบมากที่สุด', top('income') ? U.esc(top('income').label) : '—', top('income') ? F0(top('income').n) + ' คน · ' + pc(top('income').n) : ''],
      ['users', 'จำนวนตัวแทนที่รับสมัคร', recruit != null ? F0(recruit) + ' ราย' : 'ไม่พบข้อมูล', recM ? 'ผลรวม Recruit จาก ' + U.esc(recM.src) : ''],
      ['star', 'แบบประกันขายดีที่สุด', bestPlan ? U.esc(bestPlan[0]) : 'ไม่พบข้อมูล', bestPlan ? 'FYP ' + bestPlan[1].toLocaleString('th-TH', { minimumFractionDigits: 2 }) + ' บาท (Insurance Type – All)' : ''],
      ['target', 'อายุที่ตอบแบบสอบถามมากที่สุด', topAge ? U.esc(String(topAge.label).replace(/\s*ปี$/, '')) + ' ปี' : '—', topAge ? F0(topAge.n) + ' คน · ' + pc(topAge.n) : '']
    ];
    // โอกาสต่อยอด: ข้อเท็จจริงจากข้อมูล + คำถามที่ควรศึกษาต่อ (ไม่สรุปแนวโน้มการซื้อ)
    const OPP = [
      top('income') && `ช่วงรายได้ที่พบมากที่สุดคือ <b>${U.esc(top('income').label)}</b> (${pc(top('income').n)}) — ควรศึกษาเพิ่มว่ากลุ่มนี้ให้ความสำคัญกับเรื่องใดเมื่อวางแผนการเงิน`,
      top('reason') && `เหตุผลที่ตอบมากที่สุดคือ <b>${U.esc(top('reason').label)}</b> (${pc(top('reason').n)}) — ใช้เป็นประเด็นเปิดบทสนทนาเพื่อสอบถามความต้องการเพิ่มเติม`,
      pol.length && `ผู้ตอบที่ระบุว่า <b>ไม่มีกรมธรรม์</b> ${F0(none)} คน (${pc(none)}) — เป็นกลุ่มที่ควรวางแผนติดตามเพื่อทำความเข้าใจความต้องการ`,
      top('job') && `อาชีพหลักของผู้ตอบคือ <b>${U.esc(top('job').label)}</b> (${pc(top('job').n)}) — ควรศึกษาช่วงเวลาและช่องทางที่สะดวกในการติดต่อกลุ่มนี้`,
      (topBin ? `ช่วงอายุที่พบมากที่สุดคือ <b>${topBin.label}</b> (${pc(topBin.n)})` : top('age') ? `อายุที่พบมากที่สุดคือ <b>${U.esc(String(top('age').label).replace(/\s*ปี$/, ''))} ปี</b> (${pc(top('age').n)})` : '') && `${topBin ? `ช่วงอายุที่พบมากที่สุดคือ <b>${topBin.label}</b> (${pc(topBin.n)})` : `อายุที่พบมากที่สุดคือ <b>${U.esc(String(top('age').label).replace(/\s*ปี$/, ''))} ปี</b> (${pc(top('age').n)})`} — ใช้ประกอบการเตรียมคำถามสำรวจความต้องการตามช่วงวัย`
    ].filter(Boolean);

    $('view').innerHTML = `<div class="ci" style="display:flex;flex-direction:column;gap:14px">
    ${S.f.mall !== 'all' || S.f.month !== 'all' || S.f.type !== 'all' ? '<div class="na">ข้อมูลแบบสอบถามไม่มีมิติศูนย์การค้า/เดือน/ประเภทพื้นที่ จึงแสดงข้อมูลทั้งหมด (ตัวกรองด้านบนไม่มีผลกับหน้านี้)</div>' : ''}
    <div class="mini ci-kpi">
      ${kcard('ผู้ตอบแบบสอบถามทั้งหมด', N ? cnt(N, 0) : '—', 'คน', C.mode === 'raw' ? 'นับจากแถวข้อมูลรายคน' : 'ผลรวมจำนวนในหมวดเพศ', true)}
      ${kcard('สัดส่วนหญิง : ชาย', fem && mal && N ? F.pct(fem.n / N * 100, 1) + ' : ' + F.pct(mal.n / N * 100, 1) : '—', '', fem && mal ? `หญิง ${F0(fem.n)} · ชาย ${F0(mal.n)} คน` : '')}
      ${kcard('ช่วงรายได้ที่พบมากที่สุด', top('income') ? U.esc(top('income').label) : '—', '', top('income') ? `${F0(top('income').n)} คน · ${pc(top('income').n)} ของผู้ตอบ` : '', false, true)}
      ${topBin ? kcard('ช่วงอายุที่พบมากที่สุด', topBin.label, '', `${F0(topBin.n)} คน · ${pc(topBin.n)}`, false, true)
        : kcard('อายุที่พบมากที่สุด', top('age') ? U.esc(String(top('age').label).replace(/\s*ปี$/, '')) : '—', top('age') ? 'ปี' : '', top('age') ? `${F0(top('age').n)} คน · ${pc(top('age').n)}${ageOK ? '' : ' · ค่าอาจไม่ใช่อายุ'}` : '')}
      ${kcard('มีกรมธรรม์ : ไม่มี', pol.length && N ? F.pct(has / N * 100, 1) + ' : ' + F.pct(none / N * 100, 1) : '—', '', pol.length ? `มี ${F0(has)} · ไม่มี ${F0(none)} คน${multi('policy') ? ' (นับซ้ำได้)' : ''}` : '')}
    </div>
    <div class="grid g2">${box('gender', 'ข้อมูลลูกค้าตามเพศ', 'donut', 'จำนวนคนและสัดส่วน')}
      <div class="card"><div class="card-h"><div><h3>โครงสร้างอายุลูกค้า</h3><div class="cap">อายุที่พบมากที่สุด ${F0(Math.min(10, ageItems.length))} อันดับ${ageFull ? ` จากทั้งหมด ${F0(ageItems.length)} ค่าอายุ และการกระจายตามช่วงอายุ` : ` (ชีตมีข้อมูลอายุ ${F0(ageSum)} จาก ${F0(N || 0)} คน จึงไม่ใช่ข้อมูลอายุทั้งหมด)`}</div></div></div>
        ${D.age ? `<div class="chart" style="height:${barH(Math.min(10, D.age.items.length))}px"><canvas id="ci_age"></canvas></div>${ageFull ? `<h4 class="dp-sub">การกระจายตามช่วงอายุ</h4><div class="chart" style="height:200px"><canvas id="ci_ageBin"></canvas></div>` : `<div class="na">${ageOK ? 'ยังไม่แสดงการกระจายตามช่วงอายุ เพราะข้อมูลอายุในชีตไม่ครบทุกคน' : 'ค่าในหมวดอายุไม่อยู่ในช่วง 10–100 (อาจเป็นปีเกิด) จึงไม่จัดช่วงอายุ'}</div>`}` : '<div class="empty">ไม่พบข้อมูลหมวดนี้ในชีต</div>'}</div></div>
    <div class="grid g2">${box('income', 'ระดับรายได้ของลูกค้า', 'bar', top('income') ? `พบมากที่สุด: ${U.esc(top('income').label)}` : '')}${box('policy', 'สถานะการถือกรมธรรม์ของลูกค้า', 'donut', pol.length ? `ไม่มีกรมธรรม์ ${F0(none)} คน (${pc(none)})` : '')}</div>
    <div class="grid g2">${box('marital', 'สถานภาพครอบครัว', 'donut', top('marital') ? `พบมากที่สุด: ${U.esc(top('marital').label)}` : '')}${box('kids', 'ข้อมูลครอบครัวและจำนวนบุตร', 'bar', D.kids ? (() => { const no = D.kids.items.filter(x => /ไม่มี|^0/.test(x.label)).reduce((a, x) => a + x.n, 0); return `ไม่มีบุตร ${F0(no)} คน · มีบุตร ${F0(D.kids.items.reduce((a, x) => a + x.n, 0) - no)} คน`; })() : '')}</div>
    <div class="grid g2">${box('job', 'อาชีพของลูกค้า', 'bar', 'ทุกอาชีพที่มีในข้อมูล')}${box('reason', 'เหตุผลที่ลูกค้าตัดสินใจทำประกัน', 'bar', 'คำตอบที่ระบุหลายเหตุผลแสดงแยกตามที่บันทึก ไม่รวมกับคำตอบเดี่ยว')}</div>
    <div class="card"><div class="card-h"><div><h3>สรุปผลงานและข้อมูลเชิงลึกทางธุรกิจ</h3><div class="cap">คำนวณจากข้อมูลในชีต · ชี้ที่รายการเพื่อดูแหล่งข้อมูล</div></div></div>
      <div class="bi">${BI.map(([ic, l, v, d]) => `<div class="bi-i" title="${d.replace(/<[^>]+>/g, '')}"><span class="bi-ic">${ico(ic)}</span><div><div class="l">${l}</div><div class="v">${v}</div><div class="na">${d}</div></div></div>`).join('')}</div></div>
    <div class="card"><div class="card-h"><div><h3>โอกาสต่อยอดทางการตลาด</h3><div class="cap">สรุปจากข้อมูลแบบสอบถาม เพื่อใช้ตั้งคำถามและวางแผนติดตาม · ไม่ใช่ข้อสรุปว่ากลุ่มใดมีแนวโน้มซื้อมากกว่า</div></div></div>
      <ul class="opp">${OPP.map(x => `<li>${x}</li>`).join('')}</ul></div>
    ${N ? `<p class="ci-note">หมายเหตุ: จำนวนและสัดส่วนในบางหมวดเป็นการประมาณการจากสัดส่วนผลสำรวจเดิมบนฐาน ${F0(N)} ราย ไม่ใช่จำนวนที่ตรวจนับจริงจากแบบสอบถามทั้งหมด</p>` : ''}</div>`;

    drawDonuts();
    const bar = (id, items, max) => { const it = items.slice(0, max || items.length), cm = colorMap(id); hbar('ci_' + id, it.map(x => String(x.label)), it.map(x => x.n), { colors: it.map((x, i) => i === 0 ? '#1e3a8a' : '#7ea6e6'), label: 'คน', fmt: v => `${F0(v)} คน · ${pc(v)}` }); };
    ['income', 'kids', 'job', 'reason'].forEach(id => { if (D[id]) bar(id, D[id].items); });
    ['gender', 'policy', 'marital'].forEach(id => { if (D[id] && !document.querySelector('#ci_' + id + '[data-done]') && document.getElementById('ci_' + id) && !Chart.getChart('ci_' + id)) bar(id, D[id].items); });
    if (D.age) hbar('ci_age', D.age.items.slice(0, 10).map(x => String(x.label).replace(/\s*ปี$/, '') + ' ปี'), D.age.items.slice(0, 10).map(x => x.n), { colors: D.age.items.slice(0, 10).map((x, i) => i === 0 ? '#1e3a8a' : '#7ea6e6'), label: 'คน', fmt: v => `${F0(v)} คน · ${pc(v)}` });
    if (ageFull) hbar('ci_ageBin', bins.map(x => x.label), bins.map(x => x.n), { colors: bins.map(x => x === topBin ? '#0d9488' : '#99d5cf'), label: 'คน', fmt: v => `${F0(v)} คน · ${pc(v)}` });
  },

  dq() {
    const m = S.model, p = m.primary;
    const dupAll = m.tabs.reduce((s, t) => s + t.dupCount, 0);
    let h = '';
    if (p) {
      const used = p.records.filter(r => !r._dupOf);
      const proc = sum(used, 'fyp'), withDup = sum(p.records, 'fyp');
      const diff = p.sheetFypTotal != null ? (proc || 0) - p.sheetFypTotal : null;
      const keyFields = ['mall', 'fyp', 'cases', 'sumInsured', 'monthKey'].filter(f => f === 'monthKey' || has(p, f));
      const blanks = keyFields.map(f => `${f === 'monthKey' ? 'เดือน' : FIELD_RULES.find(x => x.f === f).label}: <b>${F.n(used.filter(r => r[f] == null).length)}</b>`).join(' · ');
      h += `<div class="card"><div class="card-h"><div><h3>Data Quality — ชุดข้อมูลหลักสำหรับ KPI</h3><div class="cap">เลือกแท็บที่เป็นข้อมูลระดับรายการ (ไม่ใช่ตารางสรุป) เพื่อไม่ให้ยอดถูกนับซ้ำ</div></div>
        <div class="f"><label>ชุดข้อมูลหลัก</label><select onchange="App.setPrimary(this.value)">${m.salesTabs.map(t => `<option ${t === p ? 'selected' : ''}>${U.esc(t.name)}</option>`).join('')}</select></div></div>
        <div class="dq-grid">
          <div class="stat"><div class="l">แถวที่มีข้อมูลทั้งหมด</div><div class="n">${F.n(p.totalRows)}</div></div>
          <div class="stat"><div class="l">นำมาคำนวณ</div><div class="n">${F.n(used.length)}</div></div>
          <div class="stat"><div class="l">ถูกข้าม</div><div class="n">${F.n(p.skipped.length)}</div></div>
          <div class="stat"><div class="l">แถวซ้ำ ${tipI('แถวที่ค่าทุกคอลัมน์เหมือนกันทั้งแถว (Composite Key) — ไม่ถูกนับซ้ำ เว้นแต่ติ๊กให้นับ')}</div><div class="n">${F.n(p.dupCount)}</div></div>
          <div class="stat"><div class="l">FYP จากแถวรวมในชีต</div><div class="n">${p.sheetFypTotal != null ? F.mb(p.sheetFypTotal) + '<small>ล้านบาท</small>' : '<small>ไม่มีแถวรวม</small>'}</div></div>
          <div class="stat"><div class="l">FYP หลังประมวลผล</div><div class="n">${F.mb(proc)}<small>ล้านบาท</small></div></div>
          <div class="stat" style="${diff != null && Math.abs(diff) > 1 ? 'border-color:#f2b8b8;background:var(--bad-bg)' : ''}"><div class="l">ส่วนต่าง</div><div class="n">${diff == null ? '—' : F.bahtU(diff)}</div></div>
        </div>
        <div class="na">ค่าว่างในฟิลด์สำคัญ — ${blanks}</div>
        ${p.dupCount ? `<label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" ${S.includeDup ? 'checked' : ''} onchange="App.toggleDup(this.checked)"> นับแถวที่ซ้ำด้วย (ยอดรวมถ้านับซ้ำ: ${F.bahtU(withDup)})</label>` : ''}
      </div>`;
    } else h += `<div class="banner warn">ไม่พบแท็บที่มีคอลัมน์ FYP Credit</div>`;
    // ผลรวมทุกคอลัมน์ตัวเลข ของทุกแท็บที่มี FYP → เทียบกับยอดในชีตได้ทันที
    h += `<div class="card"><h3>กระทบยอดกับชีต — ผลรวมทุกคอลัมน์ตัวเลข</h3><div class="cap">นับเฉพาะแถวรายการ (ไม่รวมแถวสรุป/แถวซ้ำ) · ใช้เทียบกับยอดที่เห็นในชีต · ตัวหนา = คอลัมน์ที่ระบบใช้</div>
      ${m.tabs.filter(t => t.records.length && t.headerRow >= 0).map(t => {
        const used = t.records.filter(r => !r._dupOf);
        const usedCols = new Set(Object.values(t.map));
        const cols = t.headers.map((hd, c) => ({ hd: hd || U.colLetter(c), c, s: used.reduce((acc, r) => { const v = U.num(r._disp[c]); return v == null ? acc : acc + v; }, 0), n: used.filter(r => U.num(r._disp[c]) != null).length })).filter(x => x.n && !/%/.test(x.hd));
        if (!cols.length) return '';
        return `<details class="raw" ${t === p ? 'open' : ''}><summary>${U.esc(t.name)}${t === p ? ' · <b>ชุดข้อมูลหลัก</b>' : ''} <span class="na">(${F.n(used.length)} แถว)</span></summary><div class="tbl-wrap" style="max-height:none"><table><thead><tr><th>คอลัมน์</th><th>ชื่อในชีต</th><th class="num">ผลรวม</th><th class="num">จำนวนแถวที่มีค่า</th></tr></thead><tbody>${cols.map(x => `<tr${usedCols.has(x.c) ? ' style="font-weight:700"' : ''}><td>${U.colLetter(x.c)}</td><td>${U.esc(x.hd)}${t.map.fyp === x.c ? ' <span class="badge good">FYP ที่ใช้</span>' : ''}</td><td class="num">${x.s.toLocaleString('th-TH', { maximumFractionDigits: 2 })}</td><td class="num">${F.n(x.n)}</td></tr>`).join('')}</tbody></table></div></details>`;
      }).join('')}</div>`;
    h += `<div class="card"><h3>Data Dictionary — ทุกแท็บในชีต</h3><div class="cap">ชื่อคอลัมน์จริง → ฟิลด์ภายใน · สถานะพร้อมใช้ · รวมแถวซ้ำทุกแท็บ ${F.n(dupAll)} แถว</div>
      ${m.tabs.map(t => `<details class="raw" ${t === p ? 'open' : ''}><summary>${U.esc(t.name)} <span class="na">— header แถว ${t.headerRow + 1 || '—'} · ใช้ได้ ${F.n(t.records.filter(r => !r._dupOf).length)} · ข้าม ${F.n(t.skipped.length)} · ซ้ำ ${F.n(t.dupCount)}${t === p ? ' · <b>ชุดข้อมูลหลัก</b>' : ''}${t.hidden ? ' · (แท็บซ่อน)' : ''}</span></summary>
        ${t.headerRow < 0 ? '<div class="na">ไม่พบแถว Header (แท็บว่างหรือเป็นกราฟ)</div>' : `<div class="tbl-wrap" style="max-height:none"><table><thead><tr><th>คอลัมน์</th><th>ชื่อในชีต</th><th>ฟิลด์ภายใน</th><th>สถานะ</th><th>หมายเหตุ</th></tr></thead><tbody>
        ${t.dict.map(d => `<tr><td>${U.colLetter(d.col)}</td><td>${U.esc(d.header)}</td><td>${d.field ? `<code>${d.field}</code> · ${U.esc(d.label)}` : '—'}</td><td><span class="badge ${d.status}">${{ good: 'พร้อมใช้', warn: 'ซ้ำ', bad: 'ใช้ไม่ได้', neutral: 'ไม่ได้ใช้' }[d.status]}</span></td><td class="na">${U.esc(d.note)}</td></tr>`).join('')}
        </tbody></table></div>
        ${t.skipped.length ? `<div style="margin-top:8px"><b>แถวที่ถูกข้าม</b><ul style="margin:4px 0 0 18px">${t.skipped.slice(0, 50).map(s => `<li>แถว ${s.row}: ${U.esc(s.reason)} <span class="na">(${U.esc((s.disp || []).filter(Boolean).slice(0, 4).join(' | '))})</span></li>`).join('')}</ul></div>` : ''}`}
      </details>`).join('')}</div>`;
    $('view').innerHTML = h;
  }
};

function completenessHTML() {
  const m = S.model, p = m.primary;
  const items = [
    ['แท็บข้อมูลการออกบูธ (Operations)', !!m.ops],
    ['FYP Credit', !!p], ['จำนวนเคส', has(p, 'cases')], ['ทุนประกัน', has(p, 'sumInsured')],
    ['เดือน/วันที่', !!m.ds.monthly], ['ศูนย์การค้า (ข้อมูลยอดขาย)', !!m.ds.mall], ['สาขา', has(p, 'branch')], ['จังหวัด', has(p, 'province')],
    ['ประเภทประกัน', !!m.ds.type], ['นิยาม LV', has(p, 'lv') || (m.lvTab && has(m.lvTab, 'fyp'))],
    ['เป้าหมายรายบูธ/ศูนย์', has(p, 'target') || !!m.targetTab], ['แท็บ Target', !!m.targetTab]
  ];
  return `<div style="display:flex;flex-wrap:wrap;gap:6px">${items.map(([l, ok]) => `<span class="badge ${ok ? 'good' : 'warn'}">${ok ? '✓' : '!'} ${l}${ok ? '' : ' — ไม่พบ'}</span>`).join('')}</div>`;
}

let lastView = null, quiet = false;
/** เปิดหน้า/เปลี่ยนเมนู → ไล่ลำดับเข้ามา · เปลี่ยนตัวกรอง → เฟดเบาๆ · รีเฟรชอัตโนมัติ → ไม่ขยับ */
function animateView(v, isNew) {
  if (REDUCED || quiet) return;
  const blocks = [...v.children];
  if (isNew) {
    const vh = window.innerHeight;
    let i = 0;
    blocks.forEach(b => {
      if (b.getBoundingClientRect().top < vh) { b.classList.remove('rise'); void b.offsetWidth; b.style.setProperty('--i', 2 + i++); b.classList.add('rise'); }
      else if ('IntersectionObserver' in window) { b.classList.add('reveal'); revealIO.observe(b); }
    });
  } else blocks.forEach(b => { b.classList.remove('refresh'); void b.offsetWidth; b.classList.add('refresh'); });
}
const revealIO = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); revealIO.unobserve(e.target); } }), { rootMargin: '0px 0px -40px 0px' }) : null;
function renderView() {
  destroyCharts();
  const v = $('view'); const isNew = lastView !== S.tab; lastView = S.tab;
  if (!S.model) { if (!S.loading) $('view').innerHTML = `<div class="card empty">ยังไม่มีข้อมูล — กด “อัปเดตข้อมูล” เพื่อเชื่อมต่อ Google Sheets</div>`; return; }
  morphCharts = !isNew && !quiet;
  try { (Views[S.tab] || Views.overview)(); animateView(v, isNew); }
  catch (e) { console.error(e); $('view').innerHTML = `<div class="banner bad">แสดงผลหน้านี้ไม่สำเร็จ: ${U.esc(e.message)}</div>`; }
}

/* =====================================================================
 * 8) START: โหลดครั้งแรก · เช็กการแก้ไขชีตทุก 60 วินาที · Refresh ทุก 5 นาที
 * ===================================================================== */
renderAll();
App.refresh();
setInterval(() => App.checkVersion(), 60 * 1000);
setInterval(() => { if (!document.hidden) App.refresh(false, true); }, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) App.checkVersion(); });
</script>
