<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DATA Booth Mall</title>
<meta name="description" content="ศูนย์รวม Dashboard Booth Mall Insurance 2569">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--text:#0f172a;--text-2:#475569;--muted:#64748b;--border:#e2e8f0;
  --nav:#0f1f44;--nav-2:#16295a;--nav-text:#c7d2e8;--accent:#2563eb;--accent-soft:#e7effd;
  --bar-h:60px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--surface:#111a2e;--text:#e5edf9;--text-2:#b6c2d8;--muted:#8a99b5;--border:#22304d;--accent-soft:#1a2a4d}}
:root[data-theme="dark"]{--bg:#0b1220;--surface:#111a2e;--text:#e5edf9;--text-2:#b6c2d8;--muted:#8a99b5;--border:#22304d;--accent-soft:#1a2a4d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.55 "IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh}

/* แถบเมนูด้านบน */
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;min-height:var(--bar-h);padding:8px 20px;background:var(--nav);color:#fff}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:#fff}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.brand b{font-size:15px;white-space:nowrap}
.brand small{display:block;font-size:11.5px;color:var(--nav-text);white-space:nowrap}
.nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;color:var(--nav-text);text-decoration:none;font-weight:500;white-space:nowrap;transition:background-color .2s ease,color .2s ease}
.nav a:hover{color:#fff;background:var(--nav-2)}
.nav a[aria-current="page"]{color:#fff;background:var(--nav-2);box-shadow:inset 0 -2px 0 var(--accent)}
.nav svg,.btn svg{width:17px;height:17px;flex:none}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;white-space:nowrap;border:0;font:inherit;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.35)}
a:focus-visible,.btn:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}

/* พื้นที่แสดง Dashboard */
main{flex:1;display:flex;flex-direction:column;min-height:0;padding:12px;gap:8px}
.frame{position:relative;flex:1;min-height:560px;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
.state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:var(--surface);color:var(--text-2)}
.state[hidden]{display:none}
.state h2{margin:0;font-size:17px;color:var(--text)}
.state p{margin:0;max-width:440px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.note{font-size:12px;color:var(--muted);text-align:center;padding:0 8px 4px}

@media (max-width:720px){
  .bar{flex-wrap:wrap;gap:8px 10px;padding:8px 12px}
  .brand small{display:none}
  .nav{order:3;flex-basis:100%}
  .bar .btn{margin-left:auto;padding:7px 11px}
  .bar .btn span{display:none}
  main{padding:8px}
  .frame{min-height:420px;border-radius:10px}
  .note{padding-bottom:0}
}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="#booth"><span class="logo">B</span><span><b>DATA Booth Mall</b><small>Booth Mall Insurance 2569</small></span></a>
  <nav class="nav" id="nav" aria-label="เมนูหลัก"></nav>
  <a class="btn ghost" id="openNew" href="#" target="_blank" rel="noopener" title="เปิด Dashboard ในแท็บใหม่">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg><span>เปิดในแท็บใหม่</span></a>
</header>

<main>
  <div class="frame">
    <iframe id="dash" title="Dashboard" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div class="state" id="loading"><div class="spin" aria-hidden="true"></div><p>กำลังโหลด Dashboard…</p></div>
    <div class="state" id="failed" hidden>
      <h2>แสดง Dashboard ในหน้านี้ไม่ได้</h2>
      <p>เบราว์เซอร์หรือเครือข่ายอาจบล็อกการแสดงผลแบบฝัง กดปุ่มด้านล่างเพื่อเปิด Dashboard ในแท็บใหม่</p>
      <a class="btn" id="openNew2" href="#" target="_blank" rel="noopener">เปิด Dashboard ในแท็บใหม่</a>
    </div>
  </div>
  <div class="note" id="note"></div>
</main>

<script>
/* เมนูของเว็บ — เพิ่มเมนูใหม่ได้ที่นี่ (id ใช้เป็น #ลิงก์ในแถบที่อยู่) */
const MENUS = [
  {
    id: 'booth',
    label: 'การออกบูธ',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
    // Google Apps Script Web App — ?tab=ops เปิดตรงหน้า "การออกบูธ" ของ Dashboard
    url: 'https://script.google.com/macros/s/AKfycbwuBmJ5kVPbULQkq2IXRNc2pDYDlmnn2PTvcCIjYY38vEEEYxqvK3mC5N70WY3S2vW7/exec?tab=ops'
  }
];

const $ = id => document.getElementById(id);
let timer = null;

function show(id) {
  const m = MENUS.find(x => x.id === id) || MENUS[0];
  $('nav').innerHTML = MENUS.map(x => `<a href="#${x.id}"${x.id === m.id ? ' aria-current="page"' : ''}>${x.icon}${x.label}</a>`).join('');
  document.title = `${m.label} · DATA Booth Mall`;
  $('openNew').href = $('openNew2').href = m.url;
  $('loading').hidden = false; $('failed').hidden = true;
  const f = $('dash');
  f.title = m.label;
  // ถ้าโหลดไม่เสร็จภายใน 25 วินาที ให้แสดงปุ่มเปิดในแท็บใหม่ (กรณีถูกบล็อกการฝัง/เครือข่ายช้า)
  clearTimeout(timer);
  timer = setTimeout(() => { $('loading').hidden = true; $('failed').hidden = false; }, 25000);
  f.onload = () => { clearTimeout(timer); $('loading').hidden = true; };
  if (f.getAttribute('src') !== m.url) f.src = m.url;
  $('note').textContent = 'ข้อมูลอัปเดตอัตโนมัติจาก Google Sheets · ถ้า Dashboard ไม่แสดง ให้กด “เปิดในแท็บใหม่”';
}

window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
</body>
</html>
