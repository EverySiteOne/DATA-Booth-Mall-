function score(){return (S.hab.length===2?40:0)+(S.done?30:0)+((S.rh||S.rc)?30:0)}

 document.documentElement.lang=S.lang;document.body.className=S.fx?'fx':'nofx';$('bl').textContent=S.lang==='th'?'EN':'TH';$('bf').textContent=S.fx?t('noanim'):t('anim');prog();
 var h='';
 if(S.scr===0)h='<h1>HEALTH HERO</h1><h2 style="margin-top:0">'+t('sub')+'</h2>'+mas(t('hi'),'cheer')+'<p class="tag">'+t('tag')+'</p><p class="note">'+t('time')+'</p><button class="btn" id="go">'+t('start')+'</button>';
 else if(S.scr===1)h=sHab();else if(S.scr===2)h=sCh();else h=sRes();

}

 var q=t('sc')[S.sc],ty=TY[S.sc],o=q[1].map(function(x,i){return '<button class="opt'+(S.pick===i?' sel':'')+'" data-o="'+i+'"'+(S.done?' disabled':'')+' aria-pressed="'+(S.pick===i)+'">'+'ABCD'[i]+'. '+x+'</button>'}).join('');
 var fb=S.done?'<div class="card"><b>'+t('fb')[ty[S.pick]]+'</b></div>':'';

 var L=level(),ty=TY[S.sc][S.pick],ck=function(a,b){return '<div class="row"><span>'+a+'</span><b>'+b+'</b></div>'};
 var cons=(S.saved?'':'')+'<div class="card"><label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5"><input type="checkbox" id="cs" style="width:26px;height:26px;flex:none"'+(S.cs?' checked':'')+'><span>'+t('cons')+'</span></label><button class="btn" id="svr"'+((S.cs&&!S.saved&&!S.saving)?'':' disabled')+'>'+(S.saved?t('svd'):t('sv'))+'</button><div class="'+S.scls+'" id="sts" role="status" style="font-weight:600;min-height:22px">'+(S.stat?t(S.stat):'')+'</div></div>';
 return mas(t('m4'),'cheer')+'<h2>'+t('s4')+'</h2><div style="text-align:center"><div class="note">'+t('cs')+'</div><span class="score" id="scv">'+score()+'</span><span style="font-size:22px;font-weight:800">/100</span><div style="font-weight:800;margin-top:6px">'+t('lv')[L]+'</div></div>'+
 '<div class="card">'+ck(t('A'),S.hab.map(function(k){return t(k)[0]}).join(', '))+ck(t('B'),t('fl')[ty])+ck(t('C'),(S.rh||S.rc)?t('rd'):t('nrd'))+'<p class="note">'+t('crit')+'</p></div>'+
 '<div class="card"><b>'+t('str')+'</b><ul>'+strengths().map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><b>'+t('nxt')+'</b><ul><li>'+t('n1')+'</li><li>'+t('n2')+'</li></ul></div>'+
 '<button class="btn s" id="ih">'+t('lh')+'</button><button class="btn s" id="ic">'+t('lc')+'</button>'+cons+'<button class="btn" id="sv">'+t('save')+'</button><button class="btn s" id="ag">'+t('again')+'</button><p class="note">'+t('disc')+'</p>';
}

 var g=$('go');if(g)g.onclick=function(){S.scr=1;render()};
 var n=$('nx');if(n)n.onclick=function(){if(S.scr===1&&S.hab.length<2)return;S.scr++;render();window.scrollTo(0,0);if(S.scr===3)confetti()};
 var b=$('bk');if(b)b.onclick=function(){if(S.scr>0){S.scr--;render()}};
 document.querySelectorAll('.hc').forEach(function(c){c.onclick=function(){toggle(c.dataset.h)};c.onpointerdown=function(e){if(e.pointerType==='mouse'&&e.button===0)startDrag(e,c.dataset.h);else if(e.target.dataset&&e.target.dataset.grip)startDrag(e,c.dataset.h)}});
 document.querySelectorAll('.slot').forEach(function(s){s.onclick=function(){var i=+s.dataset.slot;if(S.hab[i]){S.hab.splice(i,1);render()}else toast(t('hint'))};s.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();s.click()}}});

function toggle(k){var i=S.hab.indexOf(k);if(i>=0)S.hab.splice(i,1);else if(S.hab.length<2)S.hab.push(k);else{toast(t('full'));return}render()}
function slotAt(e){var el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest?el.closest('.slot'):null}
function startDrag(e,k){
 var x0=e.clientX,y0=e.clientY,moved=false,gh=null;if(e.pointerType==='mouse')e.preventDefault();
 function mv(ev){if(!moved&&Math.abs(ev.clientX-x0)+Math.abs(ev.clientY-y0)<8)return;
  if(!moved){moved=true;gh=document.createElement('div');gh.className='hc sel ghost';gh.textContent=hb(k)[1]+' '+t(k)[0];document.body.appendChild(gh)}
  gh.style.left=ev.clientX+'px';gh.style.top=ev.clientY+'px';var s=slotAt(ev);document.querySelectorAll('.slot').forEach(function(x){x.classList.toggle('hot',x===s)})}
 function up(ev){window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
  if(gh)gh.remove();document.querySelectorAll('.slot').forEach(function(x){x.classList.remove('hot')});
  if(!moved)return;var s=slotAt(ev);
  if(!s){toast(t('hint'));return}
  if(S.hab.indexOf(k)>=0){render();return}
  var i=+s.dataset.slot;if(S.hab.length>=2&&!S.hab[i]){toast(t('full'));return}
  if(S.hab[i])S.hab[i]=k;else S.hab.push(k);render()}
 window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)}

 $('mdc').innerHTML='<h2 style="margin-top:0">'+(h?t('hiT'):t('ciT'))+'</h2><p>'+(h?t('hiD'):t('ciD'))+'</p><b>'+t('chk')+'</b><ul>'+L.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><p><b>'+t('diff')+'</b></p><button class="btn s" id="mm">'+t('more')+'</button><p class="note" id="mn">'+t('ask')+'</p><p class="note">'+t('disc')+'</p><button class="btn" id="mx">'+t('close')+'</button>';
 $('md').style.display='block';

// ลิงก์ Web App (/exec) ของ Apps Script เกม HEALTH HERO – ใช้รับข้อมูลเบื้องหลังเท่านั้น
var API_URL='PASTE_HEALTH_HERO_EXEC_URL_HERE';
function saveRes(){
 if(S.saving||S.saved||!S.cs)return;
 if(API_URL.indexOf('https://script.google.com/')!==0){S.stat='svn';S.scls='bad';render();return}
 S.saving=true;S.stat='svg';S.scls='';render();var done=false;
 function fail(){if(done)return;done=true;S.saving=false;S.stat='svf';S.scls='bad';render()}
 var tm=setTimeout(fail,25000);
 fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',
  body:JSON.stringify({sessionId:S.sid,lang:S.lang,habits:S.hab,sc:S.sc,pick:S.pick,rh:S.rh,rc:S.rc,consent:'Agreed'})})
 .then(function(r){return r.json()})
 .then(function(j){clearTimeout(tm);if(done)return;if(j&&j.ok===true){done=true;S.saving=false;S.saved=true;S.stat='svo';S.scls='ok';render()}else fail()})
 .catch(function(){clearTimeout(tm);fail()});
}

fresh();render();
