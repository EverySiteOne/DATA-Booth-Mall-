 return '<svg viewBox="0 0 200 220" role="img" aria-label="น้องวัยเก๋า">'+arm+'<path d="M40 220q0-62 60-62t60 62z" fill="'+N+'"/><path d="M80 160q20 22 40 0" fill="'+L+'"/><ellipse cx="52" cy="92" rx="12" ry="22" fill="#fff" stroke="#dfe3e8"/><ellipse cx="148" cy="92" rx="12" ry="22" fill="#fff" stroke="#dfe3e8"/><circle cx="100" cy="92" r="52" fill="'+S2+'"/><path d="M70 48q30-22 60 0q-30-10-60 0" fill="#fff" stroke="#dfe3e8"/><circle cx="68" cy="104" r="8" fill="#ffb3a7" opacity=".6"/><circle cx="132" cy="104" r="8" fill="#ffb3a7" opacity=".6"/><path d="'+br+'" stroke="#9aa0a6" stroke-width="3" fill="none" stroke-linecap="round"/>'+eye+'<g fill="rgba(255,255,255,.35)" stroke="'+N+'" stroke-width="3.5"><circle cx="80" cy="88" r="17"/><circle cx="120" cy="88" r="17"/></g><path d="M97 88h6" stroke="'+N+'" stroke-width="3.5"/>'+mo+'</svg>'}
function mas(txt,mood){return '<div class="mas">'+mascot(mood)+'<div class="bub">'+txt+'</div></div>'}

function render(){
  document.documentElement.lang=S.lang;document.body.className=S.fx?'fx':'nofx';
  $('bl').textContent=S.lang==='th'?'EN':'TH';$('bf').textContent=S.fx?t('noanim'):t('anim');
  document.title='LIFE WALLET — '+t('title');
  var h='';
  if(S.scr===0)h='<h1>'+t('title')+'</h1><div class="tag">'+t('tag')+'</div>'+mas(t('sub'),'point')+'<p class="note">'+t('time')+'</p><button class="btn" id="go">'+t('start')+'</button>';
  else if(S.scr===1)h=sAlloc();
  else if(S.scr===2)h=sEvent();
  else h=sDash();
  $('app').innerHTML=h;bind();
}
function sAlloc(){
  var l=left(),p=Math.round(sum()/START*100);
  var coins=[1000,5000,10000].map(function(a){return '<div class="coin'+(S.sel===a?' on':'')+'" data-a="'+a+'" role="button" aria-label="'+fmt(a)+'">'+fmt(a)+'</div>'}).join('');
  var cards=CATS.map(function(c){var k=c[0],a=S.al[k];return '<div class="cat" data-k="'+k+'" id="c_'+k+'"><div class="ic">'+c[1]+'</div><div class="nm">'+t(k)+'</div><div class="am">฿'+fmt(a)+'</div><div class="mini"><i style="width:'+Math.round(a/START*100)+'%"></i></div><div class="ctl"><button data-m="'+k+'" aria-label="−">−</button><button data-g="'+k+'" aria-label="drag" style="width:56px">⇄</button></div></div>'}).join('');
  return mas(t(S.msg),S.mood)+'<div class="wal"><small>'+t('left')+'</small><div class="big">฿'+fmt(l)+'</div><div class="pb"><i style="width:'+(100-p)+'%"></i></div><div class="coins">'+coins+'</div></div><p class="note" style="margin:8px 2px 0">'+t('hint')+'</p><div class="grid">'+cards+'</div><button class="btn" id="nx">'+t('next')+'</button><button class="btn s" id="rs">'+t('reset')+'</button>';
}
function sEvent(){
  var e=t('ev')[S.evi],o=t('o').map(function(x,i){return '<button class="opt" data-o="'+i+'">'+x+'</button>'}).join('');
  var r='';
  if(S.pick>=0){var pool=[S.al.e,S.al.s,S.al.p+S.al.h][S.pick],cost=e[1],ok=pool>=cost;
    r='<div class="card"><div class="row"><span>'+t('r2')+'</span><b>฿'+fmt(cost)+'</b></div><div class="row"><span>'+t('r1')+'</span><b>฿'+fmt(pool)+'</b></div><p><b>'+(ok?t('okm'):t('lack'))+'</b></p>'+(S.pick===2?'<p class="note">'+t('pr')+'</p>':'')+'</div><button class="btn" id="pl">'+t('plan')+'</button>'}
  return mas(S.pick<0?e[2]+' '+e[0]:t('m3'),S.pick<0?'think':(r&&sum()?'smile':'smile'))+'<h1 style="font-size:24px">'+t('evh')+': '+e[0]+'</h1><p class="note">'+t('evn')+'</p>'+(S.pick<0?'<b>'+t('evq')+'</b>'+o:r);
}
function planName(){var b=CATS.slice().sort(function(a,c){return S.al[c[0]]-S.al[a[0]]})[0];return sum()?t('plan0')+' '+t(b[0]):t('plan0')+' —'}
function strengths(){var a=CATS.filter(function(c){return S.al[c[0]]>=15000}).map(function(c){return t('sg')[0]+t(c[0])+' ฿'+fmt(S.al[c[0]])});return a.length?a:[t('nostr')]}
function cons(){var a=CATS.filter(function(c){return !S.al[c[0]]}).map(function(c){return t('sg')[1]+t(c[0])});return a.length?a:[t('nocon')]}
function sDash(){
  var sc=Math.round(CATS.filter(function(c){return S.al[c[0]]>0}).length/6*100);
  var bars=CATS.map(function(c){var a=S.al[c[0]];return '<div class="bar"><span>'+c[1]+' '+t(c[0])+'</span><div><i style="width:'+Math.round(a/START*100)+'%"></i></div><b>'+Math.round(a/START*100)+'%</b></div>'}).join('');
  var li=function(a){return '<ul>'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'};
  return mas(planName(),'cheer')+'<h1 style="font-size:26px">'+t('dash')+'</h1><div class="card"><div class="row"><span>'+t('init')+'</span><b>฿'+fmt(START)+'</b></div><div class="row"><span>'+t('alloc')+'</span><b>฿'+fmt(sum())+'</b></div><div class="row"><span>'+t('un')+'</span><b>฿'+fmt(left())+'</b></div>'+bars+'</div>'+
  '<div class="card"><b>'+t('str')+'</b>'+li(strengths())+'<b>'+t('con')+'</b>'+li(cons())+'<b>'+t('sug')+'</b><p>'+t('sugt')+'</p><div class="row"><span>'+t('score')+'</span><b>'+sc+'/100</b></div><p class="note">'+t('crit')+'</p></div>'+
  '<div class="card"><b>'+t('ins')+'</b><p>'+t('ins0')+'</p>'+li(t('il'))+'<button class="btn s" id="ln">'+t('learn')+'</button></div><p class="note">'+t('disc')+'</p>'+
  '<div class="card"><label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5"><input type="checkbox" id="cs" style="width:24px;height:24px;flex:none"'+(S.cs?' checked':'')+'><span>'+t('cs')+'</span></label><button class="btn" id="svr"'+((S.cs&&!S.saved&&!S.saving)?'':' disabled')+'>'+(S.saved?t('svd'):t('sv2'))+'</button><div class="'+S.scls+'" style="font-weight:600;min-height:22px" id="sts" role="status">'+(S.stat?t(S.stat):'')+'</div></div><button class="btn" id="sv">'+t('save')+'</button><button class="btn s" id="sh">'+t('share')+'</button><button class="btn s" id="ag">'+t('again')+'</button>';
}

function setMsg(m,mood){S.msg=m;S.mood=mood||'smile'}
function bind(){
  var g=$('go');if(g)g.onclick=function(){S.scr=1;setMsg('m1','point');render()};
  var n=$('nx');if(n)n.onclick=function(){if(!sum()){toast(t('min'));return}S.scr=2;S.pick=-1;var q=new URLSearchParams(location.search).get('event');S.evi=(q!==null&&+q>=0&&+q<3)?+q:Math.floor(Math.random()*3);render()};
  var r=$('rs');if(r)r.onclick=reset;var a=$('ag');if(a)a.onclick=reset;
  document.querySelectorAll('.coin[data-a]').forEach(function(c){c.onpointerdown=function(e){startDrag(e,+c.dataset.a,null,true)}});
  document.querySelectorAll('.cat').forEach(function(c){c.onclick=function(){drop(c.dataset.k,S.sel,null)}});
  document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(e){e.stopPropagation();drop(null,S.sel,b.dataset.m)}});
  document.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(e){e.stopPropagation()};b.onpointerdown=function(e){e.stopPropagation();if(S.al[b.dataset.g]<=0){toast(t('nomoney'));return}startDrag(e,S.sel,b.dataset.g,false)}});
  document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){S.pick=+b.dataset.o;render()}});
  var p=$('pl');if(p)p.onclick=function(){S.scr=3;render();window.scrollTo(0,0);confetti()};
  var l=$('ln');if(l)l.onclick=function(){if(LEARN_URL)window.open(LEARN_URL,'_blank','noopener');else toast(t('nourl'))};
  var cb=$('cs');if(cb)cb.onchange=function(){S.cs=cb.checked;$('svr').disabled=!(S.cs&&!S.saved&&!S.saving)};var sr=$('svr');if(sr)sr.onclick=saveRes;var s=$('sv');if(s)s.onclick=png;var h=$('sh');if(h)h.onclick=share;
}
function reset(){S.sid=newSid();S.saved=false;S.saving=false;S.stat='';S.scls='';S.cs=false;S.al={f:0,h:0,e:0,d:0,s:0,p:0};S.scr=0;S.pick=-1;setMsg('m0','smile');render();window.scrollTo(0,0)}
function catAt(e){var el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest?el.closest('.cat'):null}
function startDrag(e,amt,from,isChip){
  e.preventDefault();var x0=e.clientX,y0=e.clientY,moved=false,gh=null;
  function mv(ev){if(!moved&&Math.abs(ev.clientX-x0)+Math.abs(ev.clientY-y0)<8)return;
    if(!moved){moved=true;gh=document.createElement('div');gh.className='coin ghost';gh.textContent=fmt(amt);document.body.appendChild(gh)}
    gh.style.left=ev.clientX+'px';gh.style.top=ev.clientY+'px';var c=catAt(ev);document.querySelectorAll('.cat').forEach(function(x){x.classList.toggle('hot',x===c)})}
  function up(ev){window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    if(gh)gh.remove();document.querySelectorAll('.cat').forEach(function(x){x.classList.remove('hot')});
    if(!moved){if(isChip){S.sel=amt;render()}return}
    var c=catAt(ev);drop(c?c.dataset.k:null,amt,from)}
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
function drop(to,amt,from){
  if(from){amt=Math.min(amt,S.al[from]);if(amt<=0){toast(t('nomoney'));return}
    if(to===from)return;S.al[from]-=amt;if(to)S.al[to]+=amt}
  else{if(amt>left()){toast(t('over'));var w=document.querySelector('.wal');if(w){w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake')}return}S.al[to]+=amt}
  setMsg('m2',left()===0?'cheer':'point');render();
  if(to){var c=$('c_'+to);if(c)c.classList.add('pop')}
}
function confetti(){if(!S.fx)return;for(var i=0;i<14;i++){var s=document.createElement('div');s.className='star';s.textContent='★';s.style.left=Math.random()*95+'vw';s.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(s);setTimeout(function(x){x.remove()},3200,s)}}
$('bl').onclick=function(){S.lang=S.lang==='th'?'en':'th';render()};
$('bf').onclick=function(){S.fx=!S.fx;render()};
$('oc').onclick=function(){$('ov').style.display='none'};

// ลิงก์ Web App (/exec) ของ Apps Script เกม LIFE WALLET – ใช้รับข้อมูลเบื้องหลังเท่านั้น
var API_URL='PASTE_LIFE_WALLET_EXEC_URL_HERE';
function saveRes(){
  if(S.saving||S.saved||!S.cs)return;
  if(API_URL.indexOf('https://script.google.com/')!==0){S.stat='svn';S.scls='bad';render();return}
  S.saving=true;S.stat='svg';S.scls='';render();
  var done=false;function fail(){if(done)return;done=true;S.saving=false;S.stat='svf';S.scls='bad';render()}
  var tm=setTimeout(fail,25000);
  var d={sessionId:S.sid,lang:S.lang,al:S.al,evi:S.evi,pick:S.pick,consent:'Agreed'};
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d),redirect:'follow'})
    .then(function(r){return r.json()})
    .then(function(j){clearTimeout(tm);if(done)return;
      if(j&&j.ok===true){done=true;S.saving=false;S.saved=true;S.stat='svo';S.scls='ok';render()}else fail()})
    .catch(function(){clearTimeout(tm);fail()});
}
function dateStr(){return new Date().toLocaleDateString(S.lang==='th'?'th-TH':'en-GB',{day:'numeric',month:'long',year:'numeric'})}
function shareText(){return 'LIFE WALLET — '+planName()+'\n'+CATS.map(function(c){return t(c[0])+': ฿'+fmt(S.al[c[0]])}).join('\n')}
function share(){var tx=shareText();
  if(navigator.share){navigator.share({title:'LIFE WALLET',text:tx}).catch(function(){})}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(function(){toast(t('copied'))},function(){toast(tx)})}
  else toast(tx)}
function buildCard(){
  var rows=CATS.map(function(c){var a=S.al[c[0]],p=Math.round(a/START*100);return '<div style="display:flex;align-items:center;gap:16px;margin:15px 0;font-size:34px"><span style="width:470px">'+c[1]+' '+t(c[0])+'</span><div style="flex:1;height:30px;background:#e1e5eb;border-radius:15px;overflow:hidden"><div style="width:'+p+'%;height:100%;background:#2F8FE0"></div></div><b style="width:200px;text-align:right">฿'+fmt(a)+'</b></div>'}).join('');
  $('card').innerHTML='<div style="width:1080px;height:1350px;background:#fff;color:#14264A;font-family:Sarabun,sans-serif;padding:64px;position:relative;overflow:hidden"><div style="position:absolute;top:0;left:0;right:0;height:26px;background:#C8E01E"></div><div style="font-size:72px;font-weight:800;margin-top:18px">LIFE WALLET</div><div style="font-size:34px;color:#5d6b82">'+t('title')+'</div>'+
   '<div style="background:#14264A;color:#fff;border-radius:34px;padding:38px;margin:36px 0"><div style="font-size:40px;color:#C8E01E;font-weight:800">'+planName()+'</div><div style="font-size:34px;opacity:.85;margin-top:8px">'+t('alloc')+' ฿'+fmt(sum())+' / ฿'+fmt(START)+'</div></div>'+rows+
   '<div style="background:#F4F6F9;border-radius:26px;padding:26px;margin-top:26px;font-size:30px;line-height:1.45"><b>'+t('pngsum')+'</b><br>'+strengths().slice(0,2).join('<br>')+'<br><b>'+t('pngp')+'</b></div>'+
   '<div style="position:absolute;left:64px;right:64px;bottom:44px;font-size:24px;color:#5d6b82;line-height:1.45">'+t('date')+' '+dateStr()+'<br>'+t('disc')+'</div></div>';
  return $('card').firstChild}
async function png(){
  if(typeof html2canvas==='undefined'){toast(t('err'));return}
  var b=$('sv');b.disabled=true;
  try{if(document.fonts)await document.fonts.ready;
    var cv=await html2canvas(buildCard(),{width:1080,height:1350,scale:1,backgroundColor:'#fff'});
    $('oi').src=cv.toDataURL('image/png');$('oc').textContent=t('close');$('ovt').textContent=t('saved');$('ov').style.display='flex';
    $('ol').textContent=t('svimg');
    var blob=await new Promise(function(r){cv.toBlob(r,'image/png')});
    $('ol').href=URL.createObjectURL(blob);$('ol').setAttribute('download','life-wallet.png');$('ol').style.display='block';
  }catch(e){toast(t('err'))}
  b.disabled=false}
render();
</script>
